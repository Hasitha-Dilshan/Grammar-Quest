cided to move to Canada.</p><p>My teacher advised me to read more.</p><p>I can’t afford to buy a car.</p></div><p>Bare infinitive (without to)</p><ul><li>After modal verbs: She can swim. You must go.</li><li>After let, make, help (optional) + object: “My parents let me go.” “The film made me cry.”</li><li>After had better and would rather: “You had better leave.”</li></ul><h3>8.3 Verbs that take both (with little or no change in meaning)</h3><p>begin, start, continue, like, love, hate, prefer, intend.</p><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>It started raining / It started to rain.</p><p>I love swimming / I love to swim.</p></div><h3>8.4 Verbs that take both (with a different meaning)</h3><div class=\"tw\"><table><tr><th>Verb</th><th>+ Gerund</th><th>+ Infinitive</th></tr><tr><td>stop</td><td>stop doing (quit): He stopped smoking.</td><td>stop in order to do: He stopped to smoke.</td></tr><tr><td>remember</td><td>recall a past action: I remember locking the door.</td><td>do not forget to do: Remember to lock the door.</td></tr><tr><td>forget</td><td>forget a past event: I’ll never forget meeting her.</td><td>forget a duty: I forgot to call him.</td></tr><tr><td>try</td><td>experiment: Try adding some salt.</td><td>make an effort: I tried to open the window.</td></tr><tr><td>regret</td><td>feel sorry about the past: I regret telling him.</td><td>formal bad news: We regret to inform you…</td></tr><tr><td>go on</td><td>continue the same action: She went on talking.</td><td>move to a new action: She went on to become a doctor.</td></tr></table></div><h3>8.5 Gerund or infinitive after prepositions and common phrases</h3><ul><li>After a preposition, always use the gerund: “She left without saying goodbye.” “I’m interested in learning Japanese.”</li></ul><ul><li>to + -ing (where “to” is a preposition): look forward to seeing, be used to driving, in addition to working.</li></ul><ul><li>used to + base verb = past habit: “I used to play football.” But be used to + -ing = be accustomed: “I am used to waking up early.”</li></ul><h3>Quick Revision Sheet: Gerunds and Infinitives</h3><p>Everything from this topic in condensed tables. Use it for last-minute revision.</p><div class=\"tw\"><table><tr><th>Form</th><th>Use</th><th>Example</th></tr><tr><td>Gerund (‑ing)</td><td>as subject, object, after prepositions</td><td>Swimming is fun. She is good at drawing.</td></tr><tr><td>Infinitive (to + V1)</td><td>purpose, after adjectives, after certain verbs</td><td>I went out to buy milk. It is easy to use.</td></tr><tr><td>Bare infinitive</td><td>after modals, let, make, had better</td><td>You must go. She made me laugh.</td></tr></table></div><div class=\"tw\"><table><tr><th>Verb + gerund</th><th>Verb + infinitive</th></tr><tr><td>enjoy, finish, avoid, mind, suggest, consider, deny, admit, keep, practise, give up, can’t help</td><td>want, need, hope, decide, plan, promise, agree, refuse, learn, manage, afford, expect, would like</td></tr><tr><td>“I enjoy reading.”</td><td>“He decided to leave.”</td></tr></table></div><h4>Different meaning</h4><div class=\"tw\"><table><tr><th>Verb</th><th>+ Gerund</th><th>+ Infinitive</th></tr><tr><td>stop</td><td>quit: He stopped smoking.</td><td>pause to do: He stopped to smoke.</td></tr><tr><td>remember / forget</td><td>past event: I remember locking it.</td><td>duty: Remember to lock it.</td></tr><tr><td>try</td><td>experiment: Try adding salt.</td><td>make effort: I tried to open it.</td></tr><tr><td>regret</td><td>past: I regret telling him.</td><td>news: We regret to inform you.</td></tr></table></div><ul><li>After a preposition always use -ing: “without saying”, “interested in learning”.</li><li>to + -ing (preposition “to”): “look forward to seeing you”; “be used to waking early”.</li><li>used to + V1 = past habit: “I used to play football.”</li></ul>","9":"<h2>9. Articles and Determiners</h2><p>Determiners come before a noun to show which one, whose, or how much/many. The most common are the articles: a, an, the.</p><h3>9.1 Indefinite articles: a / an</h3><ul><li>Use a / an with singular countable nouns when the noun is not specific or is mentioned for the first time.</li></ul><ul><li>Use a before a consonant sound: a book, a university (starts with a /y/ sound), a one-way street.</li></ul><ul><li>Use an before a vowel sound: an apple, an hour (silent h), an MBA.</li><li>Meaning “one”, a job or “per”: I have a car. She is an engineer. Twice a week.</li></ul><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>I saw a dog in the garden.</p><p>He is an honest man. (the h is silent)</p><p>She goes to a university in Colombo.</p></div><div class=\"ex\"><p>Remember: It depends on the sound, not the spelling: a European, an umbrella, an hour, a unit.</p></div><h3>9.2 Definite article: the</h3><ul><li>Already mentioned: I bought a shirt. The shirt is blue.</li><li>Unique things: the sun, the moon, the Internet, the sky, the world.</li><li>Both speaker and listener know which one: Please close the door.</li><li>Superlatives and ordinals: the best, the first, the only, the same.</li><li>Specific groups and nationalities: the rich, the French, the Sinhalese.</li><li>Rivers, seas, oceans, mountain ranges, deserts, some countries (plural / “Republic /</li></ul><p>Kingdom”): the Mahaweli, the Indian Ocean, the Himalayas, the Maldives, the United Kingdom.</p><ul><li>Musical instruments: She plays the piano.</li></ul><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>I have a cat. The cat is very friendly.</p><p>The Sun rises in the east.</p><p>She is the tallest girl in class.</p></div><h3>9.3 Zero article (no article)</h3><ul><li>Plural and uncountable nouns in general: I love music. Dogs are loyal.</li><li>Most proper names (people, cities, countries, single mountains, lakes): Sri Lanka,</li></ul><p>Mount Everest, Lake Victoria.</p><ul><li>Meals, languages, sports, subjects: have breakfast, speak English, play cricket, study history.</li></ul><ul><li>Institutions used for their main purpose: go to school / bed / church / hospital / work. (“I went to the school” = the building for another reason.)</li></ul><ul><li>Fixed phrases: by bus, at home, in town, at night.</li></ul><div class=\"tw\"><table><tr><th>No article</th><th>With article</th></tr><tr><td>He goes to school every day.</td><td>He went to the school to meet the principal.</td></tr><tr><td>Life is beautiful.</td><td>The life of a farmer is hard.</td></tr><tr><td>She is in hospital (as a patient).</td><td>She is at the hospital (visiting).</td></tr></table></div><h3>9.4 Types of determiners</h3><div class=\"tw\"><table><tr><th>Type</th><th>Words</th><th>Example</th></tr><tr><td>Articles</td><td>a, an, the</td><td>The boy has an apple.</td></tr><tr><td>Demonstratives</td><td>this, that, these, those</td><td>These shoes are comfortable.</td></tr><tr><td>Possessives</td><td>my, your, his, her, its, our, their</td><td>Our teacher is kind.</td></tr><tr><td>Quantifiers</td><td>some, any, much, many, few, little, a lot of, enough, all, both, each, every, several, no</td><td>I have a few friends.</td></tr><tr><td>Numbers</td><td>one, two, first, second</td><td>Three students passed.</td></tr><tr><td>Interrogative</td><td>which, what, whose</td><td>Which book do you want?</td></tr></table></div><h3>9.5 Quantifiers: some, any, much, many and more</h3><div class=\"tw\"><table><tr><th>Quantifier</th><th>Used with</th><th>Sentence type</th><th>Examples</th></tr><tr><td>some</td><td>countable (plural) and uncountable</td><td>Positive; also offers and requests</td><td>I have some apples. Would you like some tea?</td></tr><tr><td>any</td><td>countable (plural) and uncountable</td><td>Negative and questions; “any” = no matter which in positive</td><td>I don’t have any money. Do you have any questions? Take any book you like.</td></tr><tr><td>many</td><td>countable (plural)</td><td>Questions, negatives (and positive in formal English)</td><td>How many books do you have? There aren’t many chairs.</td></tr><tr><td>much</td><td>uncountable</td><td>Questions, negatives</td><td>How much water is left? I don’t have much time.</td></tr><tr><td>a lot of / lots of</td><td>both</td><td>Mostly positive</td><td>She has a lot of friends / a lot of money.</td></tr><tr><td>few / a few</td><td>countable (plural)</td><td>few = hardly any (negative); a few = some (positive)</td><td>Few people came. I have a few ideas.</td></tr><tr><td>little / a little</td><td>uncountable</td><td>little = hardly any; a little = some</td><td>There is little hope. I need a little help.</td></tr><tr><td>enough</td><td>both</td><td>Sufficient amount</td><td>We have enough chairs. Is there enough milk?</td></tr><tr><td>plenty of</td><td>both</td><td>More than enough</td><td>There is plenty of food.</td></tr></table></div><div class=\"ex\"><p>countable (plural)</p><p>and uncountable</p></div><div class=\"ex\"><p>I don’t have any money. Do you have any</p><p>questions? Take any book you like.</p></div><h4>positive</h4><p>many countable (plural) Questions, negatives (and How many books do you have? There positive in formal English) aren’t many chairs.</p><p>much uncountable Questions, negatives How much water is left? I don’t have much time.</p><p>a lot of / lots both Mostly positive She has a lot of friends / a lot of money.</p><h4>of</h4><p>few / a few countable (plural) few = hardly any Few people came. I have a few ideas.</p><p>(negative); a few = some (positive)</p><p>little / a little uncountable little = hardly any; a little = There is little hope. I need a little help.</p><h4>some</h4><p>enough both Sufficient amount We have enough chairs. Is there enough milk?</p><p>plenty of both More than enough There is plenty of food.</p><h4>Other quantifiers</h4><div class=\"tw\"><table><tr><th>Word</th><th>Use</th><th>Example</th></tr><tr><td>all</td><td>the whole of / every one of (3+)</td><td>All the students passed. All day.</td></tr><tr><td>both</td><td>the two</td><td>Both parents work.</td></tr><tr><td>each / every</td><td>one by one (singular verb)</td><td>Each child has a book. Every day is new.</td></tr></table></div><div class=\"tw\"><table><tr><th>Word</th><th>Use</th><th>Example</th></tr><tr><td>either / neither</td><td>one of two / not one of two</td><td>Neither answer is correct.</td></tr><tr><td>no / none</td><td>not any (no + noun; none stands alone)</td><td>I have no money. None of them came.</td></tr><tr><td>several</td><td>more than two but not many</td><td>She has several options.</td></tr></table></div><div class=\"ex\"><p>Rule of thumb: Use few / many for things you can count (few books, many cars). Use little / much for things you cannot count (little time, much money).</p></div><h3>Quick Revision Sheet: Articles and Determiners</h3><p>Everything from this topic in condensed tables. Use it for last-minute revision.</p><div class=\"tw\"><table><tr><th>Article</th><th>When to use</th><th>Example</th></tr><tr><td>a / an</td><td>singular countable, first mention, not specific. a before consonant sound, an before vowel sound</td><td>a university, an hour, an apple</td></tr><tr><td>the</td><td>already mentioned, unique, specific, superlatives, rivers/seas/mountain ranges</td><td>I saw a dog. The dog was big. The sun. The best.</td></tr><tr><td>no article</td><td>general plurals/uncountables, meals, languages, sports, most names</td><td>I love music. She plays tennis. He speaks English.</td></tr></table></div><div class=\"tip\"><b>Remember:</b> Sound, not spelling, decides: a European, an umbrella, an MBA, a one-way street.</div><div class=\"tw\"><table><tr><th>Determiner</th><th>Used with</th><th>Example</th></tr><tr><td>some</td><td>positive sentences, offers</td><td>I have some apples. Would you like some tea?</td></tr><tr><td>any</td><td>negatives, questions</td><td>I don’t have any money. Do you have any pens?</td></tr><tr><td>many</td><td>countable (plural)</td><td>How many books? There aren’t many chairs.</td></tr><tr><td>much</td><td>uncountable</td><td>How much water? I don’t have much time.</td></tr><tr><td>a lot of</td><td>both, mostly positive</td><td>She has a lot of friends.</td></tr><tr><td>few / a few</td><td>countable; few = hardly any, a few = some</td><td>Few people came. I have a few ideas.</td></tr><tr><td>little / a little</td><td>uncountable; little = hardly any, a little = some</td><td>There is little hope. I need a little help.</td></tr><tr><td>each / every</td><td>singular verb</td><td>Each child has a book.</td></tr><tr><td>all / both</td><td>all (3+), both (2)</td><td>Both parents work.</td></tr><tr><td>enough</td><td>before nouns, after adjectives</td><td>enough chairs; old enough</td></tr><tr><td>this / that / these / those</td><td>near / far, singular / plural</td><td>These shoes are new.</td></tr></table></div>","10":"<h2>10. Subject-Verb Agreement</h2><p>The verb must agree with its subject in number: a singular subject takes a singular verb, and a plural subject takes a plural verb. In the present simple, singular third-person subjects (he, she, it, the dog) take -s / -es.</p><div class=\"tip\"><b>Basic rule:</b> Singular subject + V-s | Plural subject + V (no -s)</div><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>The dog barks at night.</p><p>The dogs bark at night.</p></div><h3>10.1 Key rules</h3><div class=\"tw\"><table><tr><th>Rule</th><th>Example</th></tr><tr><td>Two subjects joined by and → plural verb</td><td>Ann and Raj are here.</td></tr><tr><td>Or / nor / either…or / neither…nor: the verb agrees with the nearer subject</td><td>Neither the boys nor the girl is ready. / Either she or they are coming.</td></tr><tr><td>Indefinite pronouns (everyone, everybody, each, nobody, someone, anything) → singular</td><td>Everyone is invited. Each of the girls has a book.</td></tr><tr><td>Uncountable nouns → singular</td><td>Information is useful. Advice was given.</td></tr><tr><td>Collective nouns (team, family, committee) → usually singular</td><td>The team is winning. The family has moved.</td></tr><tr><td>Words between the subject and verb do not change agreement</td><td>The box of chocolates is empty. The teachers, as well as the principal, are present.</td></tr><tr><td>Plural-looking singular nouns (news, mathematics, physics, politics)</td><td>The news is good. Mathematics is difficult.</td></tr><tr><td>Plural-only nouns (scissors, trousers, glasses, jeans)</td><td>My trousers are new. A pair of trousers is on the bed.</td></tr><tr><td>There is / There are: the verb agrees with the noun that follows</td><td>There is a pen on the desk. There are two books.</td></tr><tr><td>Amounts of money, time and distance → singular</td><td>Ten dollars is too much. Five miles is a long walk.</td></tr><tr><td>A number of → plural; the number of → singular</td><td>A number of students are absent. The number of students is 40.</td></tr></table></div><div class=\"tip\"><b>Tip:</b> Find the real subject first. In “The list of items is long”, the subject is list, not items.</div><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>The quality of these products is excellent.</p><p>Neither of the answers is correct.</p><p>Several of my friends live abroad.</p></div>","11":"<h2>11. Relative Clauses</h2><p>A relative clause gives more information about a noun. It begins with a relative pronoun (who, whom, which, that, whose) or relative adverb (where, when, why) and comes right after the noun it describes.</p><div class=\"tw\"><table><tr><th>Word</th><th>Refers to</th><th>Example</th></tr><tr><td>who / that</td><td>people (subject)</td><td>The girl who won the prize is my cousin.</td></tr><tr><td>whom / who</td><td>people (object)</td><td>The man whom I met was very kind.</td></tr><tr><td>which / that</td><td>things and animals</td><td>The book which I read was long.</td></tr><tr><td>whose</td><td>possession (people or things)</td><td>I know a boy whose father is a pilot.</td></tr><tr><td>where</td><td>place</td><td>This is the town where I was born.</td></tr><tr><td>when</td><td>time</td><td>I remember the day when we met.</td></tr><tr><td>why</td><td>reason</td><td>That is the reason why she left.</td></tr></table></div><h3>11.1 Defining and non-defining clauses</h3><div class=\"tw\"><table><tr><th></th><th>Defining</th><th>Non-defining</th></tr><tr><td>Purpose</td><td>Identifies which person or thing (essential)</td><td>Adds extra information (not essential)</td></tr><tr><td>Commas</td><td>No commas</td><td>Commas before and after</td></tr><tr><td>“that”</td><td>Allowed</td><td>Not allowed (use who / which)</td></tr><tr><td>Example</td><td>The man who lives next door is a doctor.</td><td>My brother, who lives in Kandy, is a doctor.</td></tr></table></div><h3>11.2 Dropping the relative pronoun</h3><ul><li>You can omit who / which / that when it is the object of the clause: “The film (that) we watched was great.”</li></ul><ul><li>You cannot omit it when it is the subject: “The woman who called you is here.”</li><li>Reduced clause: “The girl sitting by the window is my sister.” (= who is sitting)</li></ul><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>The phone (that) I bought yesterday is broken.</p><p>She is the teacher whose class I joined.</p></div>","12":"<h2>12. Question Tags</h2><p>A question tag is a short question added to the end of a statement to confirm information or ask for agreement.</p><div class=\"tip\"><b>Rule:</b> Positive statement → negative tag | Negative statement → positive</div><h4>tag</h4><div class=\"tw\"><table><tr><th>Statement</th><th>Tag</th><th>Example</th></tr><tr><td>Positive</td><td>negative tag</td><td>You like tea, don’t you?</td></tr><tr><td>Negative</td><td>positive tag</td><td>She isn’t coming, is she?</td></tr><tr><td>With auxiliary / modal</td><td>repeat the same auxiliary</td><td>He can swim, can’t he? They have left, haven’t they?</td></tr><tr><td>Simple present / past (no auxiliary)</td><td>do / does / did</td><td>She works here, doesn’t she? You called, didn’t you?</td></tr><tr><td>I am</td><td>aren’t I</td><td>I am late, aren’t I?</td></tr><tr><td>Let’s</td><td>shall we</td><td>Let’s go, shall we?</td></tr><tr><td>Imperative (command)</td><td>will you / won’t you</td><td>Close the door, will you?</td></tr><tr><td>There is / There are</td><td>isn’t there / aren’t there</td><td>There is a problem, isn’t there?</td></tr><tr><td>Everyone / somebody / nobody</td><td>they</td><td>Everyone is here, aren’t they?</td></tr><tr><td>Words like never, hardly, nobody (negative meaning)</td><td>positive tag</td><td>He never lies, does he?</td></tr></table></div><h3>12.1 Intonation</h3><ul><li>Rising voice on the tag = a real question (you are not sure): “You’re coming, aren’t you? ↗”</li><li>Falling voice on the tag = you expect agreement: “It’s a lovely day, isn’t it? ↘”</li></ul>","13":"<h2>13. Phrasal Verbs</h2><p>A phrasal verb is a verb + a particle (preposition or adverb) that together have a special meaning, often different from the verb alone. “Give up” does not mean “give” + “up”: it means stop trying.</p><h3>13.1 Types</h3><div class=\"tw\"><table><tr><th>Type</th><th>Rule</th><th>Example</th></tr><tr><td>Intransitive</td><td>No object</td><td>The car broke down. Please sit down.</td></tr><tr><td>Separable</td><td>Object can go in the middle; a pronoun must go in the middle</td><td>Turn off the light. / Turn the light off. / Turn it off. (not “turn off it”)</td></tr><tr><td>Inseparable</td><td>Object always comes after the particle</td><td>I look after my sister. (not “look my sister after”)</td></tr><tr><td>Three-word</td><td>Verb + two particles</td><td>I look forward to the trip. We ran out of milk.</td></tr></table></div><h3>13.2 Common phrasal verbs</h3><div class=\"tw\"><table><tr><th>Phrasal verb</th><th>Meaning</th><th>Example</th></tr><tr><td>give up</td><td>stop trying; quit</td><td>Don’t give up your dream.</td></tr><tr><td>look after</td><td>take care of</td><td>She looks after her grandmother.</td></tr><tr><td>look for</td><td>search</td><td>I am looking for my keys.</td></tr><tr><td>look up</td><td>search in a book / online</td><td>Look up the word in a dictionary.</td></tr><tr><td>run out of</td><td>have none left</td><td>We ran out of sugar.</td></tr><tr><td>turn down</td><td>refuse; reduce volume</td><td>He turned down the job offer.</td></tr><tr><td>put off</td><td>postpone</td><td>They put off the meeting until Monday.</td></tr><tr><td>get along with</td><td>have a good relationship</td><td>I get along with my classmates.</td></tr><tr><td>get up</td><td>leave bed</td><td>I get up at 6 a.m.</td></tr><tr><td>find out</td><td>discover information</td><td>Let’s find out the truth.</td></tr><tr><td>break down</td><td>stop working; lose control</td><td>The bus broke down on the way.</td></tr><tr><td>carry on</td><td>continue</td><td>Please carry on working.</td></tr><tr><td>come across</td><td>find by chance</td><td>I came across an old photo.</td></tr><tr><td>take off</td><td>leave the ground; remove</td><td>The plane takes off at 9. Take off your shoes.</td></tr><tr><td>call off</td><td>cancel</td><td>They called off the match because of rain.</td></tr><tr><td>set up</td><td>start / arrange</td><td>She set up a small business.</td></tr><tr><td>bring up</td><td>raise a child; mention a topic</td><td>She was brought up in Galle.</td></tr><tr><td>make up</td><td>invent; reconcile</td><td>He made up a story. They made up after the fight.</td></tr></table></div>","14":"<h2>14. Punctuation and Capital Letters</h2><h3>14.1 Punctuation marks</h3><div class=\"tw\"><table><tr><th>Mark</th><th>Main use</th><th>Example</th></tr><tr><td>Full stop .</td><td>ends a statement</td><td>I am ready.</td></tr><tr><td>Question mark ?</td><td>ends a direct question</td><td>Where do you live?</td></tr><tr><td>Exclamation mark !</td><td>strong feeling, command</td><td>What a view! Stop!</td></tr><tr><td>Comma ,</td><td>lists; after an introductory word / clause; before a FANBOYS joining two sentences; around extra information</td><td>I bought apples, oranges and bananas. When it rains, we stay in.</td></tr><tr><td>Semicolon ;</td><td>joins two closely related sentences</td><td>It rained; we stayed home.</td></tr><tr><td>Colon :</td><td>introduces a list, explanation or quotation</td><td>Bring these: a pen, a book and a bag.</td></tr><tr><td>Apostrophe ’</td><td>possession; contractions</td><td>Maya’s bag; it’s (it is); don’t (do not)</td></tr><tr><td>Quotation marks “ ”</td><td>exact words or titles</td><td>She said, “I am tired.”</td></tr><tr><td>Hyphen -</td><td>joins words; compound adjectives</td><td>well-known author; twenty-five</td></tr><tr><td>Dash –</td><td>adds emphasis or an afterthought</td><td>He finally arrived – two hours late.</td></tr><tr><td>Brackets ( )</td><td>extra, less important information</td><td>The Mahaweli (our longest river) is in the east.</td></tr></table></div><div class=\"ex\"><p>I bought apples, oranges and bananas. When</p><p>it rains, we stay in.</p></div><p>sentences; around extra information Semicolon ; joins two closely related sentences It rained; we stayed home.</p><p>Colon : introduces a list, explanation or Bring these: a pen, a book and a bag.</p><h4>quotation</h4><p>Apostrophe ’ possession; contractions Maya’s bag; it’s (it is); don’t (do not)</p><p>Quotation marks “ exact words or titles She said, “I am tired.”</p><p>”</p><p>Hyphen - joins words; compound adjectives well-known author; twenty-five Dash – adds emphasis or an afterthought He finally arrived – two hours late.</p><p>Brackets ( ) extra, less important information The Mahaweli (our longest river) is in the east.</p><h3>14.2 Capital letters</h3><ul><li>First word of a sentence and of direct speech: “She said, “Let’s go.”</li><li>The pronoun I: “I think I can.”</li><li>Names of people, places, languages, nationalities: Nimal, Colombo, Sinhala, French.</li><li>Days, months, holidays (not seasons): Monday, March, Christmas — but spring, summer.</li><li>Titles with names: Dr. Perera, Mr. Silva; and main words in titles of books and films.</li></ul><div class=\"tip warn\"><b>Common mistake:</b> it’s = it is / it has. its = belonging to it. “It’s a dog; its tail is long.”</div>","15":"<h2>15. Commonly Confused Words</h2><div class=\"tw\"><table><tr><th>Words</th><th>Difference</th><th>Example</th></tr><tr><td>their / there / they’re</td><td>belonging / place / they are</td><td>They’re in their house over there.</td></tr><tr><td>your / you’re</td><td>belonging / you are</td><td>You’re late; take your bag.</td></tr><tr><td>its / it’s</td><td>belonging / it is</td><td>It’s a dog; its tail is long.</td></tr><tr><td>then / than</td><td>time or sequence / comparison</td><td>She is taller than me. First this, then that.</td></tr><tr><td>affect / effect</td><td>verb (influence) / noun (result)</td><td>Rain affects crops. The effect was huge.</td></tr><tr><td>lose / loose</td><td>fail to keep / not tight</td><td>Don’t lose it. The shoe is loose.</td></tr><tr><td>accept / except</td><td>receive / not including</td><td>I accept your gift. Everyone came except Tom.</td></tr><tr><td>advice / advise</td><td>noun / verb</td><td>Take my advice. I advise you to rest.</td></tr><tr><td>practice / practise</td><td>noun / verb (British)</td><td>Daily practice. I practise every day.</td></tr><tr><td>quiet / quite</td><td>silent / fairly</td><td>A quiet room. It is quite cold.</td></tr><tr><td>principal / principle</td><td>head of school / rule</td><td>The principal spoke about principles.</td></tr><tr><td>to / too / two</td><td>direction / also, excessive / number</td><td>I went to school too. Two of us stayed.</td></tr><tr><td>whose / who’s</td><td>belonging / who is</td><td>Whose bag is this? Who’s there?</td></tr><tr><td>borrow / lend</td><td>take temporarily / give temporarily</td><td>May I borrow your pen? Please lend me your pen.</td></tr><tr><td>say / tell</td><td>no person / needs a person</td><td>He said hello. He told me the news.</td></tr><tr><td>fewer / less</td><td>countable / uncountable</td><td>Fewer cars, less traffic.</td></tr></table></div>","16":"<h2>16. Word Formation</h2><p>English builds new words by adding prefixes (before the word), suffixes (after the word) or by joining words together.</p><h3>16.1 Prefixes</h3><div class=\"tw\"><table><tr><th>Prefix</th><th>Meaning</th><th>Example</th></tr><tr><td>un-, in-, im-, il-, ir-, dis-, mis-, non-</td><td>not / opposite / wrongly</td><td>unhappy, incorrect, impossible, illegal, irregular, disagree, misunderstand</td></tr><tr><td>re-</td><td>again</td><td>rewrite, rebuild</td></tr><tr><td>pre-</td><td>before</td><td>prehistoric, preview</td></tr><tr><td>over- / under-</td><td>too much / too little</td><td>overeat, underestimate</td></tr><tr><td>inter-</td><td>between</td><td>international</td></tr><tr><td>co-</td><td>together</td><td>cooperate, co-author</td></tr></table></div><h3>16.2 Suffixes</h3><div class=\"tw\"><table><tr><th>Makes</th><th>Suffixes</th><th>Example</th></tr><tr><td>Nouns</td><td>‑tion, ‑sion, ‑ness, ‑ment, ‑ity, ‑er, ‑or, ‑ist, ‑ship</td><td>information, happiness, movement, teacher, artist, friendship</td></tr><tr><td>Adjectives</td><td>‑ful, ‑less, ‑able, ‑ible, ‑ous, ‑ive, ‑al, ‑y</td><td>helpful, hopeless, comfortable, dangerous, attractive, rainy</td></tr><tr><td>Verbs</td><td>‑ize / ‑ise, ‑en, ‑ify</td><td>modernize, shorten, simplify</td></tr><tr><td>Adverbs</td><td>‑ly</td><td>quick → quickly, careful → carefully</td></tr></table></div><h3>16.3 Compound words and conversion</h3><ul><li>Compound words: two words joined: toothbrush, sunflower, classroom, mother-in-law.</li><li>Conversion: same word, different part of speech: “a water (noun) bottle” → “water (verb) the plants”; “a text (noun)” → “text (verb) me”.</li></ul><ul><li>Word families: decide → decision → decisive → decisively.</li></ul>","17":"<h2>17. Top Mistakes and Final Checklist</h2><h3>17.1 Common mistakes</h3><div class=\"tw\"><table><tr><th>Wrong</th><th>Correct</th><th>Rule</th></tr><tr><td>He don’t like coffee.</td><td>He doesn’t like coffee.</td><td>he / she / it + doesn’t</td></tr><tr><td>I am agree with you.</td><td>I agree with you.</td><td>agree is a verb, no “am”</td></tr><tr><td>She is more taller than me.</td><td>She is taller than me.</td><td>no double comparative</td></tr><tr><td>I have been to there.</td><td>I have been there.</td><td>no “to” before there / here / home</td></tr><tr><td>He gave me an advice.</td><td>He gave me some advice.</td><td>advice is uncountable</td></tr><tr><td>I am living here since 2019.</td><td>I have been living here since 2019.</td><td>since → perfect tense</td></tr><tr><td>If it will rain, I will stay.</td><td>If it rains, I will stay.</td><td>no “will” after if</td></tr><tr><td>She asked me where did I live.</td><td>She asked me where I lived.</td><td>statement order in reported questions</td></tr><tr><td>I look forward to see you.</td><td>I look forward to seeing you.</td><td>to + ‑ing</td></tr><tr><td>There is many people here.</td><td>There are many people here.</td><td>agree with the noun</td></tr><tr><td>Everyone are here.</td><td>Everyone is here.</td><td>everyone = singular</td></tr><tr><td>I didn’t went there.</td><td>I didn’t go there.</td><td>did + base verb</td></tr><tr><td>She can sings well.</td><td>She can sing well.</td><td>modal + base verb</td></tr><tr><td>Their going to win.</td><td>They’re going to win.</td><td>they’re = they are</td></tr><tr><td>He is good in English.</td><td>He is good at English.</td><td>good at</td></tr></table></div><h3>17.2 Final checklist</h3><ul><li>Does every sentence have a subject and a verb, and do they agree?</li><li>Does the tense match the time word (yesterday → past, since / for → perfect)?</li><li>Do you need a / an / the before each singular countable noun?</li><li>much / many / few / little: right for countable or uncountable?</li><li>Is the preposition right (in / on / at; for vs. since)?</li><li>After modals use the base verb; after prepositions use -ing.</li><li>In if-sentences, no “will” after if (first conditional).</li><li>In reported speech: backshift, change pronouns and time words, statement word order.</li><li>Check punctuation and capital letters. Read it aloud to see if it sounds natural.</li></ul><p>Keep practising: read a little every day, write five sentences using the new rule you learned, and speak them aloud. Good luck with your English!</p>","plan":"<h2>One-Day Study Plan</h2><p>Follow this timetable to revise everything in a single day. Read each topic, say the examples aloud, then use the Quick Revision Sheet at the end of the topic to test yourself.</p><div class=\"tw\"><table><tr><th>Time block</th><th>Topics</th><th>Guide topics</th></tr><tr><td>Morning 1 (90 min)</td><td>Parts of Speech</td><td>Topic 1</td></tr><tr><td>Morning 2 (90 min)</td><td>12 Tenses + Subject-Verb Agreement</td><td>Topics 2, 10</td></tr><tr><td>Midday (60 min)</td><td>Sentence Structure + Voice</td><td>Topics 3, 4</td></tr><tr><td>Afternoon 1 (90 min)</td><td>Modals + Conditionals</td><td>Topics 5, 6</td></tr><tr><td>Afternoon 2 (90 min)</td><td>Reported Speech + Gerunds/Infinitives</td><td>Topics 7, 8</td></tr><tr><td>Evening (90 min)</td><td>Articles, Determiners + Extra topics + Mistakes list</td><td>Topics 9, 11 to 17</td></tr></table></div>"},W=[{"id": 1, "name": "Parts of Speech", "acts": [{"id": "1-1", "title": "Common or Proper?", "max": 5, "sub": "Nouns", "instr": "Write C for a common noun or P for a proper noun.", "wb": null, "opts": [], "qs": [{"q": "Colombo ▁▁▁", "long": false, "a": "P"}, {"q": "teacher ▁▁▁", "long": false, "a": "C"}, {"q": "Monday ▁▁▁", "long": false, "a": "P"}, {"q": "river ▁▁▁", "long": false, "a": "C"}, {"q": "Maya ▁▁▁", "long": false, "a": "P"}]}, {"id": "1-2", "title": "Countable or Uncountable?", "max": 5, "sub": "Nouns", "instr": "Write C for countable or U for uncountable.", "wb": null, "opts": [], "qs": [{"q": "advice ▁▁▁", "long": false, "a": "U"}, {"q": "chair ▁▁▁", "long": false, "a": "C"}, {"q": "water ▁▁▁", "long": false, "a": "U"}, {"q": "information ▁▁▁", "long": false, "a": "U"}, {"q": "book ▁▁▁", "long": false, "a": "C"}]}, {"id": "1-3", "title": "Plural Forms", "max": 5, "sub": "Nouns", "instr": "Write the plural form of each noun.", "wb": null, "opts": [], "qs": [{"q": "box → ▁▁▁", "long": false, "a": "boxes"}, {"q": "city → ▁▁▁", "long": false, "a": "cities"}, {"q": "knife → ▁▁▁", "long": false, "a": "knives"}, {"q": "child → ▁▁▁", "long": false, "a": "children"}, {"q": "sheep → ▁▁▁", "long": false, "a": "sheep"}]}, {"id": "1-4", "title": "Possessive Nouns", "max": 5, "sub": "Nouns", "instr": "Complete each phrase with the correct possessive form.", "wb": null, "opts": [], "qs": [{"q": "the bag of the girl → the ▁▁▁ bag", "long": false, "a": "girl’s"}, {"q": "the toys of the children → the ▁▁▁ toys", "long": false, "a": "children’s"}, {"q": "the books of the students → the ▁▁▁ books", "long": false, "a": "students’"}, {"q": "the car of James → ▁▁▁ car", "long": false, "a": "James’s"}, {"q": "the tail of the dog → the ▁▁▁ tail", "long": false, "a": "dog’s"}]}, {"id": "1-5", "title": "Sort the Nouns", "max": 6, "sub": "Nouns", "instr": "Write each noun from the box under the correct heading.", "wb": "honesty • table • team • Kandy • flock • freedom", "opts": [], "qs": [{"q": "Concrete", "long": false, "a": "table"}, {"q": "Abstract", "long": false, "a": "honesty, freedom"}, {"q": "Collective", "long": false, "a": "team, flock"}, {"q": "Proper", "long": false, "a": "Kandy"}]}, {"id": "1-6", "title": "Subject or Object Pronoun?", "max": 5, "sub": "Pronouns", "instr": "Choose the correct pronoun.", "wb": null, "opts": [], "qs": [{"q": "▁▁▁ (She / Her) called me.", "long": false, "a": "She"}, {"q": "I saw ▁▁▁ (he / him) yesterday.", "long": false, "a": "him"}, {"q": "▁▁▁ (We / Us) are friends.", "long": false, "a": "We"}, {"q": "Give it to ▁▁▁ (they / them).", "long": false, : "2-19", "title": "Future Continuous: Verb Forms", "max": 5, "sub": "Future Tenses", "instr": "Write the correct form of the verb.", "wb": null, "opts": [], "qs": [{"q": "This time tomorrow I ▁▁▁ (fly) to Dubai.", "long": false, "a": "will be flying"}, {"q": "At 9 p.m. she ▁▁▁ (sleep).", "long": false, "a": "will be sleeping"}, {"q": "▁▁▁ you ▁▁▁ (use) the car tonight?", "long": false, "a": "Will / be using"}, {"q": "They ▁▁▁ (not / work) next Sunday.", "long": false, "a": "will not be working"}, {"q": "At noon tomorrow we ▁▁▁ (travel).", "long": false, "a": "will be travelling"}]}, {"id": "2-20", "title": "Future Continuous: Make Sentences", "max": 5, "sub": "Future Tenses", "instr": "Write a sentence in the future continuous from the words given.", "wb": null, "opts": [], "qs": [{"q": "she / cook / at 6 p.m.", "long": true, "a": "She will be cooking at 6 p.m."}, {"q": "they / play / at this time next week", "long": true, "a": "They will be playing at this time next week."}, {"q": "he / drive / at 10 tonight", "long": true, "a": "He will be driving at 10 tonight."}, {"q": "we / sit / an exam / this time next Friday", "long": true, "a": "We will be sitting an exam this time next Friday."}, {"q": "I / lie / on the beach / next Sunday", "long": true, "a": "I will be lying on the beach next Sunday."}]}, {"id": "2-21", "title": "Future Perfect: Verb Forms", "max": 5, "sub": "Future Tenses", "instr": "Write the correct form of the verb.", "wb": null, "opts": [], "qs": [{"q": "By 2030, she ▁▁▁ (graduate).", "long": false, "a": "will have graduated"}, {"q": "I ▁▁▁ (finish) the report by Friday.", "long": false, "a": "will have finished"}, {"q": "By the time you arrive, we ▁▁▁ (eat).", "long": false, "a": "will have eaten"}, {"q": "They ▁▁▁ (not / complete) the work by noon.", "long": false, "a": "will not have completed"}, {"q": "▁▁▁ you ▁▁▁ (leave) by 5?", "long": false, "a": "Will / have left"}]}, {"id": "2-22", "title": "Future Simple or Future Perfect?", "max": 5, "sub": "Future Tenses", "instr": "Choose the correct form.", "wb": null, "opts": [], "qs": [{"q": "I ▁▁▁ the book by Sunday. (will finish / will have finished)", "long": false, "a": "will have finished"}, {"q": "I ▁▁▁ it now and call you. (will finish / will have finished)", "long": false, "a": "will finish"}, {"q": "By next year, he ▁▁▁ here for ten years. (will live / will have lived)", "long": false, "a": "will have lived"}, {"q": "She ▁▁▁ you tomorrow. (will help / will have helped)", "long": false, "a": "will help"}, {"q": "By the time we reach, the film ▁▁▁ (will start / will have started)", "long": false, "a": "will have started"}]}, {"id": "2-23", "title": "Future Perfect Continuous: Verb Forms", "max": 5, "sub": "Future Tenses", "instr": "Write the correct form of the verb.", "wb": null, "opts": [], "qs": [{"q": "By June, I ▁▁▁ (work) here for five years.", "long": false, "a": "will have been working"}, {"q": "By 5 p.m. she ▁▁▁ (study) for six hours.", "long": false, "a": "will have been studying"}, {"q": "By the time he retires, he ▁▁▁ (teach) for forty years.", "long": false, "a": "will have been teaching"}, {"q": "In March, they ▁▁▁ (live) in Japan for a decade.", "long": false, "a": "will have been living"}, {"q": "How long ▁▁▁ you ▁▁▁ (drive) by midnight?", "long": false, "a": "will / have been driving"}]}, {"id": "2-24", "title": "Future Perfect Continuous: Make Sentences", "max": 5, "sub": "Future Tenses", "instr": "Write a sentence from the words given. Start with “By …”.", "wb": null, "opts": [], "qs": [{"q": "December / I / learn English / two years", "long": true, "a": "By December, I will have been learning English for two years."}, {"q": "7 a.m. / she / run / one hour", "long": true, "a": "By 7 a.m., she will have been running for one hour."}, {"q": "noon / they / wait / three hours", "long": true, "a": "By noon, they will have been waiting for three hours."}, {"q": "midnight / he / drive / ten hours", "long": true, "a": "By midnight, he will have been driving for ten hours."}, {"q": "next May / we / live here / fifteen years", "long": true, "a": "By next May, we will have been living here for fifteen years."}]}, {"id": "2-25", "title": "Name the Tense", "max": 5, "sub": "Mixed Tense Practice", "instr": "Write the name of the tense in each sentence.", "wb": null, "opts": [], "qs": [{"q": "She has been waiting for an hour.", "long": false, "a": "present perfect continuous"}, {"q": "I will have finished by noon.", "long": false, "a": "future perfect"}, {"q": "They were playing cricket.", "long": false, "a": "past continuous"}, {"q": "He had left before I came.", "long": false, "a": "past perfect"}, {"q": "We are meeting him tomorrow.", "long": false, "a": "present continuous (future plan)"}]}, {"id": "2-26", "title": "Choose the Correct Tense", "max": 5, "sub": "Mixed Tense Practice", "instr": "Write the correct form of the verb.", "wb": null, "opts": [], "qs": [{"q": "I ▁▁▁ (see) him yesterday.", "long": false, "a": "saw"}, {"q": "She ▁▁▁ (live) here since 2015.", "long": false, "a": "has lived"}, {"q": "When I called, he ▁▁▁ (sleep).", "long": false, "a": "was sleeping"}, {"q": "By next year, I ▁▁▁ (graduate).", "long": false, "a": "will have graduated"}, {"q": "Water ▁▁▁ (freeze) at 0 °C.", "long": false, "a": "freezes"}]}, {"id": "2-27", "title": "Correct the Tense Mistakes", "max": 5, "sub": "Mixed Tense Practice", "instr": "Rewrite each sentence correctly.", "wb": null, "opts": [], "qs": [{"q": "I am living here since 2019.", "long": true, "a": "I have been living here since 2019."}, {"q": "She didn’t went to school.", "long": true, "a": "She didn’t go to school."}, {"q": "When I will arrive, I will call you.", "long": true, "a": "When I arrive, I will call you."}, {"q": "I have seen him yesterday.", "long": true, "a": "I saw him yesterday."}, {"q": "He is working here for five years.", "long": true, "a": "He has been working here for five years."}]}, {"id": "2-28", "title": "Match Tense and Use", "max": 5, "sub": "Mixed Tense Practice", "instr": "Match each tense with its main use.", "wb": null, "opts": ["A) life experience", "B) earlier of two past actions", "C) habits and facts", "D) action in progress in the past", "E) completed before a future time"], "qs": [{"q": "Simple present", "long": false, "a": "C"}, {"q": "Present perfect", "long": false, "a": "A"}, {"q": "Past continuous", "long": false, "a": "D"}, {"q": "Past perfect", "long": false, "a": "B"}, {"q": "Future perfect", "long": false, "a": "E"}]}, {"id": "2-29", "title": "Complete the Story", "max": 2, "sub": "Mixed Tense Practice", "instr": "Write the correct form of each verb in brackets.", "wb": null, "opts": [], "qs": [{"q": "Last Sunday, Nimal ▁▁▁ (go) to the market. He ▁▁▁ (walk) there because his bike ▁▁▁ (break) the day before. While he ▁▁▁ (shop), he ▁▁▁ (meet) an old friend.", "long": false, "a": "went / walked / had broken / was shopping / met"}, {"q": "I ▁▁▁ (live) in Matara for six years now. I ▁▁▁ (move) here in 2020 when I ▁▁▁ (get) a job. By next June, I ▁▁▁ (work) here for seven years.", "long": false, "a": "have lived / moved / got / will have been working"}]}, {"id": "2-30", "title": "Write About Yourself", "max": 5, "sub": "Mixed Tense Practice", "instr": "Write one true sentence for each tense.", "wb": null, "opts": [], "qs": [{"q": "Simple present (your daily routine)", "long": true, "a": "Sample: I get up at 6 a.m."}, {"q": "Present continuous (what you are doing now)", "long": true, "a": "Sample: I am studying English."}, {"q": "Present perfect (something you have done)", "long": true, "a": "Sample: I have visited Kandy."}, {"q": "Simple past (what you did yesterday)", "long": true, "a": "Sample: I went to the market yesterday."}, {"q": "Simple future (what you will do tomorrow)", "long": true, "a": "Sample: I will visit my aunt tomorrow."}]}]}, {"id": 3, "name": "Sentence Structure", "acts": [{"id": "3-1", "title": "Find the Subject", "max": 5, "sub": "Subjects and Predicates", "instr": "Write the complete subject of each sentence.", "wb": null, "opts": [], "qs": [{"q": "My brother and I are studying English.", "long": false, "a": "My brother and I"}, {"q": "The old man in the park feeds the birds.", "long": false, "a": "The old man in the park"}, {"q": "Birds fly.", "long": false, "a": "Birds"}, {"q": "Everyone in the class laughed.", "long": false, "a": "Everyone in the class"}, {"q": "The young girl sings beautifully.", "long": false, "a": "The young girl"}]}, {"id": "3-2", "title": "Find the Predicate", "max": 5, "sub": "Subjects and Predicates", "instr": "Write the predicate of each sentence.", "wb": null, "opts": [], "qs": [{"q": "The dog barked loudly.", "long": false, "a": "barked loudly"}, {"q": "She is a teacher.", "long": false, "a": "is a teacher"}, {"q": "We watched a film last night.", "long": false, "a": "watched a film last night"}, {"q": "Rain fell all day.", "long": false, "a": "fell all day"}, {"q": "The children are playing outside.", "long": false, "a": "are playing outside"}]}, {"id": "3-3", "title": "Direct or Indirect Object?", "max": 5, "sub": "Objects and Patterns", "instr": "Write DO (direct object) or IO (indirect object) for the words in CAPITALS.", "wb": null, "opts": [], "qs": [{"q": "He bought A CAR. ▁▁▁", "long": false, "a": "DO"}, {"q": "She sent HER MOTHER a letter. ▁▁▁", "long": false, "a": "IO"}, {"q": "I made DINNER for them. ▁▁▁", "long": false, "a": "DO"}, {"q": "I made dinner for THEM. ▁▁▁", "long": false, "a": "IO"}, {"q": "They showed ME the photo. ▁▁▁", "long": false, "a": "IO"}]}, {"id": "3-4", "title": "Sentence Patterns", "max": 5, "sub": "Objects and Patterns", "instr": "Write the pattern: S+V, S+V+O, S+V+C, S+V+IO+DO or S+V+O+C.", "wb": null, "opts": [], "qs": [{"q": "Birds fly. ▁▁▁", "long": false, "a": "S+V"}, {"q": "She reads novels. ▁▁▁", "long": false, "a": "S+V+O"}, {"q": "He seems tired. ▁▁▁", "long": false, "a": "S+V+C"}, {"q": "He showed me the photo. ▁▁▁", "long": false, "a": "S+V+IO+DO"}, {"q": "They made her captain. ▁▁▁", "long": false, "a": "S+V+O+C"}]}, {"id": "3-5", "title": "Independent or Dependent Clause?", "max": 5, "sub": "Phrases, Clauses and Sentence Types", "instr": "Write I (independent) or D (dependent).", "wb": null, "opts": [], "qs": [{"q": "She smiled. ▁▁▁", "long": false, "a": "I"}, {"q": "because she was happy ▁▁▁", "long": false, "a": "D"}, {"q": "although it rained ▁▁▁", "long": false, "a": "D"}, {"q": "The dog barked. ▁▁▁", "long": false, "a": "I"}, {"q": "when the bell rang ▁▁▁", "long": false, "a": "D"}]}, {"id": "3-6", "title": "Simple, Compound, Complex or Compound-Complex?", "max": 5, "sub": "Phrases, Clauses and Sentence Types", "instr": "Name the type of each sentence.", "wb": null, "opts": [], "qs": [{"q": "The dog barked.", "long": false, "a": "simple"}, {"q": "The dog barked, and the cat ran away.", "long": false, "a": "compound"}, {"q": "The cat ran away because the dog barked.", "long": false, "a": "complex"}, {"q": "When the bell rang, the students left, and the teacher locked the room.", "long": false, "a": "compound-complex"}, {"q": "Sunil and Ravi play and practise daily.", "long": false, "a": "simple"}]}, {"id": "3-7", "title": "Build Sentences", "max": 5, "sub": "Phrases, Clauses and Sentence Types", "instr": "Join the sentences as shown.", "wb": null, "opts": [], "qs": [{"q": "It was raining. We stayed in. (compound with so)", "long": true, "a": "It was raining, so we stayed in."}, {"q": "She is clever. She is lazy. (compound with but)", "long": true, "a": "She is clever, but she is lazy."}, {"q": "He was late. The bus broke down. (complex with because)", "long": true, "a": "He was late because the bus broke down."}, {"q": "She was tired. She finished the work. (complex with although)", "long": true, "a": "Although she was tired, she finished the work."}, {"q": "The rain stopped. We went out. (complex with when)", "long": true, "a": "When the rain stopped, we went out."}]}, {"id": "3-8", "title": "Fix the Sentence Errors", "max": 5, "sub": "Phrases, Clauses and Sentence Types", "instr": "Correct each fragment, run-on or comma splice.", "wb": null, "opts": [], "qs": [{"q": "Because I was late.", "long": true, "a": "Sample: I missed the bus because I was late."}, {"q": "I was tired I went to bed.", "long": true, "a": "I was tired, so I went to bed."}, {"q": "It was late, we left.", "long": true, "a": "It was late, so we left."}, {"q": "When the bell rang.", "long": true, "a": "Sample: When the bell rang, we left."}, {"q": "She likes tea, she likes coffee too.", "long": true, "a": "She likes tea, and she likes coffee too."}]}, {"id": "3-9", "title": "Types of Sentences by Purpose", "max": 5, "sub": "Phrases, Clauses and Sentence Types", "instr": "Write Declarative, Interrogative, Imperative or Exclamatory.", "wb": null, "opts": [], "qs": [{"q": "Please sit down.", "long": false, "a": "imperative"}, {"q": "What a lovely day!", "long": false, "a": "exclamatory"}, {"q": "Do you like tea?", "long": false, "a": "interrogative"}, {"q": "I like tea.", "long": false, "a": "declarative"}, {"q": "Close the door.", "long": false, "a": "imperative"}]}]}, {"id": 4, "name": "Voice: Active and Passive", "acts": [{"id": "4-1", "title": "Active or Passive?", "max": 5, "sub": "Recognising and Forming the Passive", "instr": "Write A (active) or P (passive).", "wb": null, "opts": [], "qs": [{"q": "The meal was cooked. ▁▁▁", "long": false, "a": "P"}, {"q": "She cooked the meal. ▁▁▁", "long": false, "a": "A"}, {"q": "English is spoken here. ▁▁▁", "long": false, "a": "P"}, {"q": "They are playing cricket. ▁▁▁", "long": false, "a": "A"}, {"q": "The bridge was completed in 2020. ▁▁▁", "long": false, "a": "P"}]}, {"id": "4-2", "title": "Passive Verb Forms", "max": 5, "sub": "Recognising and Forming the Passive", "instr": "Write the correct passive form of the verb.", "wb": null, "opts": [], "qs": [{"q": "English ▁▁▁ (speak) here.", "long": false, "a": "is spoken"}, {"q": "The road ▁▁▁ (repair) now.", "long": false, "a": "is being repaired"}, {"q": "The work ▁▁▁ (finish).", "long": false, "a": "has been finished"}, {"q": "The window ▁▁▁ (break) yesterday.", "long": false, "a": "was broken"}, {"q": "The results ▁▁▁ (announce) soon.", "long": false, "a": "will be announced"}]}, {"id": "4-3", "title": "Active to Passive", "max": 5, "sub": "Recognising and Forming the Passive", "instr": "Rewrite each sentence in the passive voice.", "wb": null, "opts": [], "qs": [{"q": "Rita wrote the letter.", "long": true, "a": "The letter was written by Rita."}, {"q": "They are building a bridge.", "long": true, "a": "A bridge is being built."}, {"q": "Someone has stolen my bike.", "long": true, "a": "My bike has been stolen."}, {"q": "The chef cooked the meal.", "long": true, "a": "The meal was cooked by the chef."}, {"q": "We will finish the work.", "long": true, "a": "The work will be finished."}]}, {"id": "4-4", "title": "Passive to Active", "max": 5, "sub": "Recognising and Forming the Passive", "instr": "Rewrite each sentence in the active voice.", "wb": null, "opts": [], "qs": [{"q": "The cake was baked by Maya.", "long": true, "a": "Maya baked the cake."}, {"q": "The window was broken by the boys.", "long": true, "a": "The boys broke the window."}, {"q": "A letter is written by her every week.", "long": true, "a": "She writes a letter every week."}, {"q": "The match has been won by our team.", "long": true, "a": "Our team has won the match."}, {"q": "The song was sung by a famous artist.", "long": true, "a": "A famous artist sang the song."}]}, {"id": "4-5", "title": "Modals and Infinitives in the Passive", "max": 5, "sub": "Recognising and Forming the Passive", "instr": "Complete with the passive form.", "wb": null, "opts": [], "qs": [{"q": "This rule must ▁▁▁ (follow).", "long": false, "a": "be followed"}, {"q": "The task can ▁▁▁ (do) easily.", "long": false, "a": "be done"}, {"q": "I want ▁▁▁ (tell) the truth.", "long": false, "a": "to be told"}, {"q": "The s": [{"id": "5-1", "title": "Can, Could, May, Might", "max": 5, "sub": "Uses of Modal Verbs", "instr": "Choose the correct modal.", "wb": null, "opts": [], "qs": [{"q": "She ▁▁▁ speak three languages. (can / must)", "long": false, "a": "can"}, {"q": "▁▁▁ you help me, please? (Could / Must)", "long": false, "a": "Could"}, {"q": "It ▁▁▁ rain later; take an umbrella. (may / can’t)", "long": false, "a": "may"}, {"q": "▁▁▁ I leave early today? (May / Would)", "long": false, "a": "May"}, {"q": "He ▁▁▁ be late; the roads are busy. (might / shall)", "long": false, "a": "might"}]}, {"id": "5-2", "title": "Should, Ought to, Had better", "max": 5, "sub": "Uses of Modal Verbs", "instr": "Choose should, ought to or had better.", "wb": null, "opts": [], "qs": [{"q": "You look ill. You ▁▁▁ see a doctor.", "long": false, "a": "should"}, {"q": "We ▁▁▁ respect our elders.", "long": false, "a": "ought to"}, {"q": "You ▁▁▁ leave now, or you’ll miss the bus.", "long": false, "a": "had better"}, {"q": "He ▁▁▁ not drive so fast.", "long": false, "a": "should"}, {"q": "You ▁▁▁ eat more vegetables.", "long": false, "a": "should"}]}, {"id": "5-3", "title": "Match Modal and Meaning", "max": 5, "sub": "Uses of Modal Verbs", "instr": "Match each modal with its main meaning.", "wb": null, "opts": ["A) prohibition", "B) formal permission", "C) ability", "D) advice", "E) weak possibility"], "qs": [{"q": "can", "long": false, "a": "C"}, {"q": "mustn’t", "long": false, "a": "A"}, {"q": "should", "long": false, "a": "D"}, {"q": "may", "long": false, "a": "B"}, {"q": "might", "long": false, "a": "E"}]}, {"id": "5-4", "title": "Polite Requests and Offers", "max": 5, "sub": "Uses of Modal Verbs", "instr": "Rewrite politely using a modal verb.", "wb": null, "opts": [], "qs": [{"q": "Give me water.", "long": true, "a": "Could you give me some water, please?"}, {"q": "I will carry your bag. (offer)", "long": true, "a": "Shall I carry your bag?"}, {"q": "Open the window.", "long": true, "a": "Would you open
