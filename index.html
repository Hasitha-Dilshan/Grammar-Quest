:root{--tc:#1cb0f6;--tc2:#1899d6}

<header><div class="top"><div class="logo" data-a="home">🦉 Grammar Quest</div><span class="st" id="fire"></span><span class="st" id="xp"></span><button class="th" id="mode" data-a="mode" title="Switch mode">📖</button><button class="th" id="tts" data-a="tts" title="Listen to teacher" style="display:none">🔊</button><button class="th" id="th" data-a="theme" title="Dark / Light"></button></div></header>

<script>
const G={"0":"<h2>0. English Basics</h2><p>Welcome! 🦉 This is the best place to start. Here you will learn the letters of English, how words and sentences work, and how to say “one” and “many”. Take your time, say each example aloud, and try the little activities after every part.</p><div class=\"tip\"><b>How to learn:</b> read a part → tap the examples to hear them → do the activities → move on. Small steps every day work best!</div><h3>0.1 The Alphabet 🔤</h3><p>English has <b>26 letters</b>. Each letter has a <b>capital</b> (big) form and a <b>small</b> form: A a, B b, C c. The letters always come in the same order, called <b>alphabetical order</b>.</p><div class=\"tw\"><table><tr><th>Letters</th><th>Name</th><th>Example word</th></tr><tr><td>A a</td><td>ay</td><td>apple 🍎</td></tr><tr><td>B b</td><td>bee</td><td>ball ⚽</td></tr><tr><td>C c</td><td>see</td><td>cat 🐱</td></tr><tr><td>D d</td><td>dee</td><td>dog 🐶</td></tr><tr><td>E e</td><td>ee</td><td>egg 🥚</td></tr><tr><td>F f</td><td>ef</td><td>fish 🐟</td></tr><tr><td>G g</td><td>jee</td><td>goat 🐐</td></tr><tr><td>H h</td><td>aitch</td><td>hat 🎩</td></tr><tr><td>I i</td><td>eye</td><td>ice cream 🍦</td></tr><tr><td>J j</td><td>jay</td><td>jug 🏺</td></tr><tr><td>K k</td><td>kay</td><td>kite 🪁</td></tr><tr><td>L l</td><td>el</td><td>lion 🦁</td></tr><tr><td>M m</td><td>em</td><td>monkey 🐵</td></tr><tr><td>N n</td><td>en</td><td>nest 🪺</td></tr><tr><td>O o</td><td>oh</td><td>orange 🍊</td></tr><tr><td>P p</td><td>pee</td><td>pencil ✏️</td></tr><tr><td>Q q</td><td>kyoo</td><td>queen 👑</td></tr><tr><td>R r</td><td>ar</td><td>rabbit 🐰</td></tr><tr><td>S s</td><td>ess</td><td>sun ☀️</td></tr><tr><td>T t</td><td>tee</td><td>tree 🌳</td></tr><tr><td>U u</td><td>yoo</td><td>umbrella ☂️</td></tr><tr><td>V v</td><td>vee</td><td>van 🚐</td></tr><tr><td>W w</td><td>double-yoo</td><td>watch ⌚</td></tr><tr><td>X x</td><td>ex</td><td>box (ends with x) 📦</td></tr><tr><td>Y y</td><td>why</td><td>yo-yo 🪀</td></tr><tr><td>Z z</td><td>zed (zee in US)</td><td>zebra 🦓</td></tr></table></div><div class=\"ex\"><b>Examples</b><p>A, B, C, D, E: after C comes D.</p><p>Alphabetical order: apple, ball, cat, dog.</p></div><div class=\"tip\"><b>Tip:</b> sing the alphabet song to remember the order. Learn the order, because dictionaries use it!</div><h3>0.2 Vowels and Consonants 🎵</h3><p>The 26 letters are split into two groups: <b>5 vowels</b> and <b>21 consonants</b>. Vowels make open, singing sounds. Every English word has at least one vowel sound.</p><div class=\"tw\"><table><tr><th>Group</th><th>Letters</th><th>Example words</th></tr><tr><td>Vowels (5)</td><td>a  e  i  o  u</td><td>apple, egg, ink, orange, umbrella</td></tr><tr><td>Consonants (21)</td><td>b c d f g h j k l m n p q r s t v w x y z</td><td>ball, cat, dog, fish, sun</td></tr></table></div><h4 class=\"exl\">Examples</h4><p>cat = c (consonant) + a (vowel) + t (consonant).</p><p>tree has 2 vowels: e and e.</p><div class=\"tip\"><b>Special letter:</b> y is a consonant in “yes”, but it makes a vowel sound in “happy” and “my”.</div><h4>Short and long vowel sounds</h4><div class=\"tw\"><table><tr><th>Vowel</th><th>Short sound</th><th>Long sound</th></tr><tr><td>a</td><td>cat</td><td>cake</td></tr><tr><td>e</td><td>bed</td><td>tree</td></tr><tr><td>i</td><td>sit</td><td>bike</td></tr><tr><td>o</td><td>hot</td><td>nose</td></tr><tr><td>u</td><td>cup</td><td>cube</td></tr></table></div><h4>Syllables 👏</h4><p>A <b>syllable</b> is one beat in a word. Clap as you say it. Each syllable has a vowel sound.</p><div class=\"tw\"><table><tr><th>Word</th><th>Claps</th><th>Syllables</th></tr><tr><td>cat</td><td>1</td><td>cat</td></tr><tr><td>water</td><td>2</td><td>wa-ter</td></tr><tr><td>banana</td><td>3</td><td>ba-na-na</td></tr><tr><td>elephant</td><td>3</td><td>el-e-phant</td></tr></table></div><h3>0.3 Capital and Small Letters 🔠</h3><p>Use a <b>capital letter</b> (big letter) in these places. Everywhere else use small letters.</p><div class=\"tw\"><table><tr><th>Use a capital for</th><th>Example</th></tr><tr><td>The first word of a sentence</td><td>The sun is hot.</td></tr><tr><td>The word I</td><td>Today I am happy.</td></tr><tr><td>Names of people</td><td>Nimal, Maya, Mr. Silva</td></tr><tr><td>Names of places</td><td>Colombo, Sri Lanka, Asia</td></tr><tr><td>Days and months</td><td>Monday, March</td></tr><tr><td>Special days</td><td>Christmas, Vesak</td></tr></table></div><div class=\"tip\"><b>Remember:</b> the names of days and months always start with a capital: Friday, July. But seasons and colours do not: summer, red.</div><h3>0.4 Words and Sentences ✏️</h3><p>A <b>word</b> is a group of letters that means something. A <b>sentence</b> is a group of words that tells a complete idea. It starts with a <b>capital letter</b> and ends with a <b>full stop</b> (.), a <b>question mark</b> (?) or an <b>exclamation mark</b> (!).</p><div class=\"tw\"><table><tr><th>Kind</th><th>Ends with</th><th>Example</th></tr><tr><td>Telling sentence</td><td>full stop .</td><td>I like mangoes.</td></tr><tr><td>Asking sentence</td><td>question mark ?</td><td>Do you like mangoes?</td></tr><tr><td>Strong feeling</td><td>exclamation mark !</td><td>What a sweet mango!</td></tr></table></div><div class=\"ex\"><b>Examples</b><p>✅ The dog runs fast.</p><p>❌ dog runs (this is not a complete sentence)</p><p>❌ the dog runs fast (needs a capital T and a full stop)</p></div><div class=\"tip\"><b>Simple sentence recipe:</b> Who or what? + What do they do? → “The bird sings.”</div><h3>0.5 A or An? 🍎</h3><p>We use <b>a</b> or <b>an</b> before a thing when we mean “one”. The rule is about the <b>sound</b> at the start of the next word.</p><div class=\"tw\"><table><tr><th>Use</th><th>When the next word starts with</th><th>Examples</th></tr><tr><td>a</td><td>a consonant sound</td><td>a dog, a book, a pen</td></tr><tr><td>an</td><td>a vowel sound (a e i o u)</td><td>an apple, an egg, an umbrella</td></tr></table></div><div class=\"ex\"><b>Examples</b><p>an hour (the h is silent, so it starts with the sound “ow”)</p><p>a university (it starts with the sound “yoo”)</p></div><div class=\"tip\"><b>Listen, do not look!</b> It is a sound rule: an hour, a unit.</div><h3>0.6 Singular and Plural 🔢</h3><p><b>Singular</b> means one thing. <b>Plural</b> means more than one. We usually make a plural by adding <b>-s</b>, but some words change in special ways.</p><div class=\"tw\"><table><tr><th>Rule</th><th>Singular</th><th>Plural</th></tr><tr><td>Add ‑s (most words)</td><td>book</td><td>books</td></tr><tr><td>Ends in s, x, ch, sh: add ‑es</td><td>box</td><td>boxes</td></tr><tr><td></td><td>bus</td><td>buses</td></tr><tr><td></td><td>watch</td><td>watches</td></tr><tr><td>Consonant + y: change y to ‑ies</td><td>baby</td><td>babies</td></tr><tr><td>Vowel + y: just add ‑s</td><td>toy</td><td>toys</td></tr><tr><td>Ends in f / fe: change to ‑ves</td><td>leaf</td><td>leaves</td></tr><tr><td></td><td>knife</td><td>knives</td></tr><tr><td>Special (irregular) words</td><td>man</td><td>men</td></tr><tr><td></td><td>woman</td><td>women</td></tr><tr><td></td><td>child</td><td>children</td></tr><tr><td></td><td>foot</td><td>feet</td></tr><tr><td></td><td>tooth</td><td>teeth</td></tr><tr><td></td><td>mouse</td><td>mice</td></tr><tr><td>Same word for both</td><td>sheep</td><td>sheep</td></tr><tr><td></td><td>fish</td><td>fish</td></tr></table></div><div class=\"ex\"><b>Examples</b><p>One cat is on the mat. Two cats are on the mat.</p><p>This is my book. These are my books.</p><p>That is a bus. Those are buses.</p></div><div class=\"tip\"><b>Is or are?</b> Use <b>is</b> for one thing and <b>are</b> for many things. “This / that” are for one. “These / those” are for many.</div><h3>0.7 Numbers, Days and Months 📅</h3><div class=\"tw\"><table><tr><th>Number</th><th>Word</th><th>Number</th><th>Word</th></tr><tr><td>1</td><td>one</td><td>11</td><td>eleven</td></tr><tr><td>2</td><td>two</td><td>12</td><td>twelve</td></tr><tr><td>3</td><td>three</td><td>13</td><td>thirteen</td></tr><tr><td>4</td><td>four</td><td>14</td><td>fourteen</td></tr><tr><td>5</td><td>five</td><td>15</td><td>fifteen</td></tr><tr><td>6</td><td>six</td><td>20</td><td>twenty</td></tr><tr><td>7</td><td>seven</td><td>30</td><td>thirty</td></tr><tr><td>8</td><td>eight</td><td>40</td><td>forty</td></tr><tr><td>9</td><td>nine</td><td>50</td><td>fifty</td></tr><tr><td>10</td><td>ten</td><td>100</td><td>one hundred</td></tr></table></div><div class=\"tw\"><table><tr><th>7 days of the week</th><th>12 months of the year</th></tr><tr><td>Monday</td><td>January</td></tr><tr><td>Tuesday</td><td>February</td></tr><tr><td>Wednesday</td><td>March</td></tr><tr><td>Thursday</td><td>April</td></tr><tr><td>Friday</td><td>May</td></tr><tr><td>Saturday</td><td>June</td></tr><tr><td>Sunday</td><td>July</td></tr><tr><td></td><td>August</td></tr><tr><td></td><td>September</td></tr><tr><td></td><td>October</td></tr><tr><td></td><td>November</td></tr><tr><td></td><td>December</td></tr></table></div><div class=\"tip\"><b>Order words:</b> first, second, third, fourth, fifth. Example: Monday is the first day of the school week.</div><h3>0.8 Question Words ❓</h3><p>Question words help us ask for information. They come at the start of a question.</p><div class=\"tw\"><table><tr><th>Word</th><th>Asks about</th><th>Example</th></tr><tr><td>What</td><td>a thing</td><td>What is your name?</td></tr><tr><td>Who</td><td>a person</td><td>Who is that girl?</td></tr><tr><td>Where</td><td>a place</td><td>Where do you live?</td></tr><tr><td>When</td><td>a time</td><td>When is your birthday?</td></tr><tr><td>Why</td><td>a reason</td><td>Why are you late?</td></tr><tr><td>How</td><td>the way / how many</td><td>How are you? How many pens?</td></tr></table></div><div class=\"ex\"><b>Examples</b><p>What is this? It is a book.</p><p>Where is the cat? It is under the table.</p></div><h2>Quick Revision Sheet: English Basics</h2><p>Everything from this topic in small tables. Use it for a quick check.</p><div class=\"tw\"><table><tr><th>Topic</th><th>Remember</th></tr><tr><td>Alphabet</td><td>26 letters in a fixed order, A to Z</td></tr><tr><td>Vowels</td><td>a e i o u (5). The rest are consonants (21)</td></tr><tr><td>Capital letters</td><td>Start of a sentence, I, names, places, days, months</td></tr><tr><td>Sentence</td><td>Capital letter + complete idea + . ? or !</td></tr><tr><td>a / an</td><td>a + consonant sound; an + vowel sound</td></tr><tr><td>Plural</td><td>+s, +es, y→ies, f→ves, irregular: man→men</td></tr><tr><td>is / are</td><td>is = one; are = many</td></tr><tr><td>Question words</td><td>what, who, where, when, why, how</td></tr></table></div>","1":"<h2>1. Parts of Speech</h2><p>Every word in English belongs to a category called a part of speech. Knowing the category tells you what the word does in a sentence. There are eight: nouns, pronouns, verbs, adjectives, adverbs, conjunctions, interjections and prepositions.</p><h3>1.1 Nouns</h3><p>A noun names a person, place, thing, animal, idea or feeling.</p><div class=\"tw\"><table><tr><th>Type</th><th>Meaning</th><th>Examples</th></tr><tr><td>Common</td><td>General name of a person, place or thing</td><td>teacher, city, book</td></tr><tr><td>Proper</td><td>Specific name; always starts with a capital letter</td><td>Nimal, Colombo, Monday</td></tr><tr><td>Concrete</td><td>Can be seen or touched (five senses)</td><td>table, rain, coffee</td></tr><tr><td>Abstract</td><td>Ideas, feelings, qualities</td><td>freedom, love, honesty</td></tr><tr><td>Collective</td><td>A group seen as one unit</td><td>team, family, committee, flock</td></tr><tr><td>Countable</td><td>Can be counted; has singular and plural</td><td>one pen, two pens</td></tr><tr><td>Uncountable</td><td>Cannot be counted; no plural form</td><td>water, advice, information, furniture</td></tr></table></div><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>Maya lives in Kandy and loves music. (proper, proper, abstract)</p><p>The team is winning. (collective noun used as one unit)</p><p>She gave me some good advice. (uncountable: never “advices”)</p></div><h4>Plural rules</h4><div class=\"tw\"><table><tr><th>Rule</th><th>Examples</th></tr><tr><td>Most nouns: add ‑s</td><td>book → books, car → cars</td></tr><tr><td>Ending in s, x, z, ch, sh: add ‑es</td><td>bus → buses, box → boxes, church → churches</td></tr><tr><td>Consonant + y: change y to ‑ies</td><td>city → cities, baby → babies</td></tr><tr><td>Vowel + y: add ‑s</td><td>day → days, key → keys</td></tr><tr><td>Ending in f / fe: often change to ‑ves</td><td>knife → knives, leaf → leaves (but roof → roofs)</td></tr><tr><td>Ending in consonant + o: often add ‑es</td><td>potato → potatoes, hero → heroes (but photo → photos)</td></tr><tr><td>Irregular plurals</td><td>man → men, woman → women, child → children, foot → feet, tooth → teeth, mouse → mice, person → people</td></tr><tr><td>Same singular and plural</td><td>sheep, fish, deer, series</td></tr></table></div><h4>Possessive nouns</h4><ul><li>Singular noun: add ’s → the girl’s bag, James’s car.</li><li>Plural noun ending in -s: add only ’ → the students’ books.</li><li>Irregular plural: add ’s → the children’s toys.</li></ul><h3>1.2 Pronouns</h3><p>A pronoun replaces a noun so we do not repeat it. “Kamal is tired because Kamal worked late” becomes “Kamal is tired because he worked late.”</p><div class=\"tw\"><table><tr><th>Subject</th><th>Object</th><th>Possessive adjective</th><th>Possessive pronoun</th><th>Reflexive</th></tr><tr><td>I</td><td>me</td><td>my</td><td>mine</td><td>myself</td></tr><tr><td>you</td><td>you</td><td>your</td><td>yours</td><td>yourself / yourselves</td></tr><tr><td>he</td><td>him</td><td>his</td><td>his</td><td>himself</td></tr><tr><td>she</td><td>her</td><td>her</td><td>hers</td><td>herself</td></tr><tr><td>it</td><td>it</td><td>its</td><td>—</td><td>itself</td></tr><tr><td>we</td><td>us</td><td>our</td><td>ours</td><td>ourselves</td></tr><tr><td>they</td><td>them</td><td>their</td><td>theirs</td><td>themselves</td></tr></table></div><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>She called him yesterday. (subject she, object him)</p><p>This is my pen, and that one is yours. (possessive adjective, possessive pronoun)</p><p>He taught himself to play the guitar. (reflexive: subject and object are the same person)</p></div><h4>Other pronoun types</h4><div class=\"tw\"><table><tr><td>Type</td><td>Words</td><td>Example</td></tr><tr><td>Demonstrative</td><td>this, that, these, those</td><td>These are my keys.</td></tr><tr><td>Relative</td><td>who, whom, whose, which, that</td><td>The girl who won is my cousin.</td></tr><tr><td>Interrogative</td><td>who, what, which, whose</td><td>Which do you prefer?</td></tr><tr><td>Indefinite</td><td>someone, anybody, nothing, everyone, each, both</td><td>Everyone was late.</td></tr><tr><td>Reciprocal</td><td>each other, one another</td><td>They help each other.</td></tr></table></div><div class=\"ex\"><p>Tip: Use who for people (subject), whom for people (object), which for things, and that for people or things in defining clauses. Indefinite pronouns like everyone and nobody take a singular verb: “Everyone is here.”</p></div><h3>1.3 Verbs</h3><p>A verb expresses an action, an event or a state of being. Every complete sentence needs at least one verb.</p><div class=\"tw\"><table><tr><th>Type</th><th>Job</th><th>Example</th></tr><tr><td>Action (dynamic)</td><td>Shows physical or mental action</td><td>She runs daily. I think so.</td></tr><tr><td>Linking</td><td>Connects the subject to a description</td><td>The soup smells great. He became a doctor.</td></tr><tr><td>Auxiliary (helping)</td><td>Helps form tenses, questions, negatives, passives</td><td>She has left. Do you know? It was built.</td></tr><tr><td>Modal</td><td>Shows ability, possibility, obligation (see Section 5)</td><td>You must go. He can swim.</td></tr><tr><td>Transitive</td><td>Needs an object</td><td>She wrote a letter.</td></tr><tr><td>Intransitive</td><td>Needs no object</td><td>The baby slept.</td></tr><tr><td>Stative</td><td>Describes a state, not usually in continuous form</td><td>I know the answer. (not “I am knowing”)</td></tr><tr><td>Phrasal verb</td><td>Verb + particle with a special meaning</td><td>give up, look after, run out of</td></tr></table></div><h4>The five verb forms</h4><div class=\"tw\"><table><tr><th>Base (V1)</th><th>Past (V2)</th><th>Past participle (V3)</th><th>‑ing form</th><th>‑s form</th></tr><tr><td>walk</td><td>walked</td><td>walked</td><td>walking</td><td>walks</td></tr><tr><td>go</td><td>went</td><td>gone</td><td>going</td><td>goes</td></tr><tr><td>write</td><td>wrote</td><td>written</td><td>writing</td><td>writes</td></tr><tr><td>take</td><td>took</td><td>taken</td><td>taking</td><td>takes</td></tr><tr><td>buy</td><td>bought</td><td>bought</td><td>buying</td><td>buys</td></tr><tr><td>be</td><td>was / were</td><td>been</td><td>being</td><td>is</td></tr></table></div><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>Regular: She walked home. She has walked home.</p><p>Irregular: He wrote a poem. He has written many poems.</p><p>Subject-verb agreement: The dog barks; the dogs bark.</p></div><div class=\"ex\"><p>Tip: In the present simple, add -s / -es to the verb only for he, she, it: “He watches TV”, not “He watch TV”.</p></div><h3>1.4 Adjectives</h3><p>An adjective describes a noun or pronoun. It tells us what kind, which one, how many or whose.</p><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>She wore a beautiful red dress.</p><p>I have three brothers, and each one is tall.</p><p>The food tastes delicious. (adjective after a linking verb)</p></div><h4>Order of adjectives</h4><p>When two or more adjectives come before a noun, they follow this order: Opinion → Size → Age → Shape → Colour → Origin → Material → Purpose + noun.</p><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>a lovely small old wooden box</p><p>a big round blue plastic ball</p><p>my new Italian leather shoes</p></div><h4>Comparatives and superlatives</h4><div class=\"tw\"><table><tr><th>Adjective type</th><th>Comparative</th><th>Superlative</th><th>Example</th></tr><tr><td>One syllable</td><td>+ ‑er</td><td>+ ‑est</td><td>tall → taller → tallest</td></tr><tr><td>One syllable ending in consonant-vowel-consonant</td><td>double letter + ‑er</td><td>double letter + ‑est</td><td>big → bigger → biggest</td></tr><tr><td>Ending in ‑y</td><td>y → ‑ier</td><td>y → ‑iest</td><td>happy → happier → happiest</td></tr><tr><td>Two or more syllables</td><td>more + adj</td><td>most + adj</td><td>beautiful → more beautiful → most beautiful</td></tr><tr><td>Irregular</td><td>—</td><td>—</td><td>good → better → best; bad → worse → worst; far → farther → farthest</td></tr></table></div><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>Colombo is bigger than Galle.</p><p>This is the most interesting book I have read.</p><p>She is as tall as her brother. (equal comparison)</p></div><div class=\"ex\"><p>Common mistake: Do not mix them up: -ed adjectives describe how a person feels (I am bored); -ing adjectives describe the thing causing the feeling (The film is boring).</p></div><h3>1.5 Adverbs</h3><p>An adverb describes a verb, an adjective, another adverb or a whole sentence. Many adverbs are formed by adding -ly to an adjective (quick → quickly).</p><div class=\"tw\"><table><tr><th>Type</th><th>Answers</th><th>Examples</th></tr><tr><td>Manner</td><td>How?</td><td>slowly, carefully, well, hard</td></tr><tr><td>Time</td><td>When?</td><td>now, yesterday, soon, already</td></tr><tr><td>Place</td><td>Where?</td><td>here, there, outside, upstairs</td></tr><tr><td>Frequency</td><td>How often?</td><td>always, usually, often, sometimes, rarely, never</td></tr><tr><td>Degree</td><td>How much?</td><td>very, quite, too, extremely, almost</td></tr></table></div><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>She sings beautifully. (modifies verb)</p><p>It is extremely hot today. (modifies adjective)</p><p>He never eats meat. (frequency adverb goes before the main verb but after “be”: He is never late.)</p></div><div class=\"ex\"><p>Common mistake: Good is an adjective, well is its adverb: “She is a good singer. She sings well.” Some adverbs look like adjectives: fast, hard, late. “He works hard” (not “hardly”, which means “almost not”).</p></div><h3>1.6 Conjunctions</h3><p>A conjunction joins words, phrases or clauses.</p><div class=\"tw\"><table><tr><th>Type</th><th>Words</th><th>Example</th></tr><tr><td>Coordinating (FANBOYS)</td><td>for, and, nor, but, or, yet, so</td><td>I was tired, but I kept working.</td></tr><tr><td>Subordinating</td><td>because, although, if, when, while, since, unless, after, before</td><td>Although it rained, we went out.</td></tr><tr><td>Correlative (pairs)</td><td>either…or, neither…nor, both…and, not only…but also</td><td>She is both smart and kind.</td></tr><tr><td>Conjunctive adverbs</td><td>however, therefore, moreover, otherwise</td><td>It was late; therefore, we left.</td></tr></table></div><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>I wanted to go, so I asked my parents.</p><p>Unless you hurry, you will miss the bus.</p><p>Not only is he funny, but also he is generous.</p></div><div class=\"ex\"><p>Tip: Put a comma before a coordinating conjunction that joins two full sentences, and after a subordinate clause that begins a sentence: “When it rains, the roads flood.”</p></div><h3>1.7 Interjections</h3><p>An interjection is a short word or sound that expresses sudden emotion. It is usually followed by an exclamation mark or a comma and does not connect grammatically to the rest of the sentence.</p><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>Wow! That was an amazing goal.</p><p>Oh no, I forgot my keys.</p><p>Ouch! That hurt. / Hurray! We won. / Oops, I’m sorry.</p></div><h3>1.8 Prepositions</h3><p>A preposition shows the relationship between a noun or pronoun and another word, usually relating to time, place, direction or manner. A preposition is followed by a noun, pronoun or -ing form (never by a bare verb).</p><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>The book is on the table under the window.</p><p>We walked through the park after lunch.</p><p>She is good at drawing. (preposition + -ing, not “at draw”)</p></div><h4>IN, ON, AT: time</h4><div class=\"tw\"><table><tr><th>Preposition</th><th>Use with</th><th>Examples</th></tr><tr><td>in</td><td>Months, years, seasons, centuries, parts of a day, long periods</td><td>in July, in 2024, in winter, in the 21st century, in the morning, in an hour (= after an hour)</td></tr><tr><td>on</td><td>Days, dates, specific days, special days</td><td>on Monday, on 5 May, on Christmas Day, on Friday evening</td></tr><tr><td>at</td><td>Clock times, night, weekends (UK), precise points</td><td>at 6 o’clock, at night, at noon, at the weekend, at the moment</td></tr></table></div><h4>IN, ON, AT: place</h4><div class=\"tw\"><table><tr><th>Preposition</th><th>Use with</th><th>Examples</th></tr><tr><td>in</td><td>Enclosed spaces, cities, countries, large areas</td><td>in the room, in a box, in Sri Lanka, in the sea, in bed</td></tr><tr><td>on</td><td>Surfaces, lines, streets, floors, transport you can walk on</td><td>on the wall, on the floor, on Main Street, on the bus, on a plane</td></tr><tr><td>at</td><td>Specific points, addresses, events, buildings as a location</td><td>at the door, at 25 Park Road, at the bus stop, at school, at a party, at the airport</td></tr></table></div><h4>BY</h4><ul><li>Method or means: travel by bus / car / train; pay by card; contact me by email.</li><li>Agent in the passive: The book was written by Martin Wickramasinghe.</li><li>Deadline (not later than): Please finish by Friday.</li><li>Next to / beside: She sat by the window.</li><li>Passing: He walked by me without a word.</li></ul><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>I go to work by bus.</p><p>Submit the report by 5 p.m.</p><p>This song was sung by a famous artist.</p></div><h4>FOR</h4><ul><li>Duration: I have lived here for ten years.</li><li>Purpose or reason: This tool is for cutting paper. / He was fined for speeding.</li><li>Beneficiary (intended receiver): I bought a gift for my mother.</li><li>Support / in favour of: Are you for or against the plan?</li><li>Exchange or price: She paid Rs. 500 for the book.</li></ul><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>We waited for two hours.</p><p>This letter is for you.</p><p>Thank you for helping me.</p></div><div class=\"tip\"><b>Remember:</b> For = a length of time (for two weeks). Since = a starting point (since Monday).</div><h4>OF</h4><ul><li>Belonging / relationship: the capital of France; a friend of mine.</li><li>Part of a whole / quantity: a piece of cake; most of the students; a cup of tea.</li><li>Content or material: a glass of milk; a ring made of gold.</li><li>Description / measure: a boy of ten; a man of great wisdom.</li><li>After certain words: afraid of, proud of, think of, aware of, full of.</li></ul><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>She is afraid of dogs.</p><p>The cover of the book is red.</p><p>Two of my friends are doctors.</p></div><h4>TO</h4><ul><li>Direction / destination: I am going to school. She moved to London.</li><li>Recipient (indirect object): Give the keys to him. She wrote a letter to her aunt.</li><li>Limit or range: from Monday to Friday; from 9 to 5.</li><li>Comparison / attitude: similar to; prefer tea to coffee; listen to music.</li><li>Infinitive marker (not a preposition): I want to learn. (see Section 8)</li><li>To + -ing: look forward to meeting you; be used to waking up early.</li></ul><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>We drove to the beach.</p><p>I look forward to hearing from you.</p><p>He explained the rules to the new students.</p></div><h4>Other useful prepositions</h4><div class=\"tw\"><table><tr><th>Preposition</th><th>Meaning</th><th>Example</th></tr><tr><td>between / among</td><td>between = two; among = three or more</td><td>between you and me; among the crowd</td></tr><tr><td>above / over / below / under</td><td>higher or lower than</td><td>A bridge over the river</td></tr><tr><td>across / through / along</td><td>movement paths</td><td>walk across the road, along the beach</td></tr><tr><td>during / while</td><td>during + noun; while + clause</td><td>during the lesson; while he was studying</td></tr><tr><td>with / without</td><td>accompanying or lacking</td><td>a tea with milk; without sugar</td></tr></table></div><p>Adjective, verb and noun + preposition</p><div class=\"tw\"><table><tr><th>Combination</th><th>Examples</th></tr><tr><td>Adjective + preposition</td><td>good at, interested in, afraid of, famous for, married to, different from, angry with (person) / about (thing)</td></tr><tr><td>Verb + preposition</td><td>depend on, listen to, wait for, apologise for, believe in, consist of, agree with</td></tr><tr><td>Noun + preposition</td><td>reason for, increase in, solution to, key to, damage to</td></tr></table></div><h3>Quick Revision Sheet: Parts of Speech</h3><p>Everything from this topic in condensed tables. Use it for last-minute revision.</p><div class=\"tw\"><table><tr><th>Part</th><th>Job</th><th>Example</th></tr><tr><td>Noun</td><td>Names a person, place, thing or idea</td><td>Sara bought a book in London.</td></tr><tr><td>Pronoun</td><td>Replaces a noun</td><td>She said it was good.</td></tr><tr><td>Verb</td><td>Shows action or state</td><td>He runs. She is happy.</td></tr><tr><td>Adjective</td><td>Describes a noun</td><td>a tall man, three apples</td></tr><tr><td>Adverb</td><td>Describes a verb, adjective or adverb</td><td>She sings well. It is very cold.</td></tr><tr><td>Preposition</td><td>Shows place, time, direction</td><td>The cat is under the table.</td></tr><tr><td>Conjunction</td><td>Joins words or clauses</td><td>I was tired but happy.</td></tr><tr><td>Interjection</td><td>Shows sudden emotion</td><td>Wow! That was great.</td></tr></table></div><h4>Nouns</h4><div class=\"tw\"><table><tr><th>Kind</th><th>Meaning</th><th>Example</th></tr><tr><td>Common / Proper</td><td>general name / specific name (capital letter)</td><td>city / Kandy</td></tr><tr><td>Concrete / Abstract</td><td>can touch / idea or feeling</td><td>table / freedom</td></tr><tr><td>Countable / Uncountable</td><td>has plural / no plural</td><td>pens / advice, water, information</td></tr><tr><td>Collective</td><td>a group as one unit</td><td>The team is ready.</td></tr></table></div><div class=\"tw\"><table><tr><th>Plural rule</th><th>Example</th></tr><tr><td>Add ‑s (most nouns)</td><td>book → books</td></tr><tr><td>‑s, ‑x, ‑z, ‑ch, ‑sh → add ‑es</td><td>box → boxes, church → churches</td></tr><tr><td>Consonant + y → ‑ies</td><td>city → cities (but day → days)</td></tr><tr><td>‑f / ‑fe → ‑ves</td><td>knife → knives, leaf → leaves</td></tr><tr><td>Irregular</td><td>man → men, child → children, foot → feet, mouse → mice</td></tr><tr><td>Same form</td><td>sheep, fish, deer</td></tr></table></div><h4>Pronouns</h4><div class=\"tw\"><table><tr><th>Subject</th><th>Object</th><th>Possessive adj.</th><th>Possessive pron.</th><th>Reflexive</th></tr><tr><td>I</td><td>me</td><td>my</td><td>mine</td><td>myself</td></tr><tr><td>you</td><td>you</td><td>your</td><td>yours</td><td>yourself</td></tr><tr><td>he / she / it</td><td>him / her / it</td><td>his / her / its</td><td>his / hers / —</td><td>himself / herself / itself</td></tr><tr><td>we</td><td>us</td><td>our</td><td>ours</td><td>ourselves</td></tr><tr><td>they</td><td>them</td><td>their</td><td>theirs</td><td>themselves</td></tr></table></div><ul><li>Relative: who (people), which (things), that (both), whose (possession). “The man who called is my uncle.”</li></ul><ul><li>Demonstrative: this / these (near), that / those (far). “Those are my shoes.”</li><li>Indefinite: someone, anything, nobody, everyone (take singular verbs). “Everyone is here.”</li></ul><h4>Verbs</h4><div class=\"tw\"><table><tr><th>Type</th><th>Example</th></tr><tr><td>Action / Linking (be, seem, become, look)</td><td>She sings. / He seems tired.</td></tr><tr><td>Auxiliary (be, have, do)</td><td>She has left. Do you know?</td></tr><tr><td>Modal (can, must, should…)</td><td>You should rest.</td></tr><tr><td>Transitive (needs object) / Intransitive</td><td>She opened the door. / The baby slept.</td></tr><tr><td>Regular / Irregular</td><td>walk–walked–walked / go–went–gone</td></tr><tr><td>Stative (no ‑ing form): know, like, want, own</td><td>I know him. (not “I am knowing”)</td></tr></table></div><div class=\"tw\"><table><tr><th>V1 (base)</th><th>V2 (past)</th><th>V3 (participle)</th><th>‑ing</th></tr><tr><td>be</td><td>was / were</td><td>been</td><td>being</td></tr><tr><td>go</td><td>went</td><td>gone</td><td>going</td></tr><tr><td>see</td><td>saw</td><td>seen</td><td>seeing</td></tr><tr><td>write</td><td>wrote</td><td>written</td><td>writing</td></tr><tr><td>buy</td><td>bought</td><td>bought</td><td>buying</td></tr><tr><td>put</td><td>put</td><td>put</td><td>putting</td></tr></table></div><h4>Adjectives</h4><ul><li>Order: Opinion → Size → Age → Shape → Colour → Origin → Material → Purpose. “a lovely small old round red Italian leather bag”.</li></ul><ul><li>-ed = how you feel; -ing = what causes it. “I am bored. The film is boring.”</li></ul><div class=\"tw\"><table><tr><th>Type</th><th>Comparative</th><th>Superlative</th><th>Example</th></tr><tr><td>Short (1 syllable)</td><td>+ er</td><td>+ est</td><td>tall → taller → tallest</td></tr><tr><td>Ends in ‑y</td><td>‑ier</td><td>‑iest</td><td>happy → happier → happiest</td></tr><tr><td>Long (2+ syllables)</td><td>more + adj</td><td>most + adj</td><td>beautiful → more → most beautiful</td></tr><tr><td>Irregular</td><td>better / worse / farther</td><td>best / worst / farthest</td><td>good → better → best</td></tr><tr><td>Equal</td><td>as + adj + as</td><td></td><td>She is as tall as me.</td></tr></table></div><h4>Adverbs</h4><div class=\"tw\"><table><tr><th>Type</th><th>Examples</th><th>Sentence</th></tr><tr><td>Manner (how)</td><td>slowly, well, hard</td><td>He drives carefully.</td></tr><tr><td>Time (when)</td><td>now, soon, yesterday</td><td>I will call soon.</td></tr><tr><td>Place (where)</td><td>here, outside, abroad</td><td>Wait here.</td></tr><tr><td>Frequency (how often)</td><td>always, often, never</td><td>She never lies. (before main verb, after be)</td></tr><tr><td>Degree (how much)</td><td>very, quite, too, enough</td><td>It is too hot.</td></tr></table></div><div class=\"ex\"><p>Watch out: Good (adjective) → well (adverb): “She is a good singer; she sings well.” Hard = with effort; hardly = almost not.</p></div><h4>Prepositions</h4><div class=\"tw\"><table class=\"grid\"><tr><th></th><th>IN</th><th>ON</th><th>AT</th></tr><tr><td>Time</td><td>months, years, seasons, parts of day<br><i>in May, in 2025, in the morning</i></td><td>days and dates<br><i>on Monday, on 5 May</i></td><td>clock time, night, holidays<br><i>at 6 pm, at night, at Christmas</i></td></tr><tr><td>Place</td><td>inside, cities, countries<br><i>in the box, in Sri Lanka</i></td><td>surfaces, streets, transport<br><i>on the wall, on the bus</i></td><td>points, addresses, events<br><i>at the door, at school, at a party</i></td></tr></table></div><div class=\"ex\"><p>inside, cities, countries</p><p>in the box, in Sri Lanka</p></div><div class=\"ex\"><p>surfaces, streets, transport</p><p>on the wall, on the bus</p></div><h4>party</h4><div class=\"tw\"><table><tr><th>Word</th><th>Use</th><th>Example</th></tr><tr><td>by</td><td>means / agent / deadline / next to</td><td>go by bus; written by Smith; finish by Friday</td></tr><tr><td>for</td><td>duration, purpose, beneficiary</td><td>wait for an hour; a gift for you</td></tr><tr><td>since</td><td>starting point (with perfect tenses)</td><td>live here since 2020</td></tr><tr><td>of</td><td>belonging, part, content</td><td>the door of the car; a cup of tea</td></tr><tr><td>to</td><td>direction, recipient, limit</td><td>go to school; give it to him</td></tr><tr><td>between / among</td><td>two / more than two</td><td>between you and me; among the crowd</td></tr></table></div><h4>Conjunctions</h4><div class=\"tw\"><table><tr><th>Type</th><th>Words</th><th>Example</th></tr><tr><td>Coordinating (FANBOYS)</td><td>for, and, nor, but, or, yet, so</td><td>I was tired, but I worked.</td></tr><tr><td>Subordinating</td><td>because, although, if, when, while, unless, since</td><td>Although it rained, we went.</td></tr><tr><td>Correlative</td><td>either…or, neither…nor, both…and, not only…but also</td><td>Both Ann and Raj came.</td></tr><tr><td>Linking adverbs</td><td>however, therefore, moreover</td><td>It rained; however, we went.</td></tr></table></div><p>Interjections: Oh! Wow! Ouch! Oops! Hurray! — used for feeling, usually followed by “!”. Example:</p><p>“Oops! I dropped it.”</p>","2":"<h2>2. The 12 Verb Tenses</h2><p>A tense shows when an action happens (past, present or future) and what kind of time it covers (simple, continuous, perfect or perfect continuous). Three times × four aspects = twelve tenses.</p><h3>2.1 Overview table</h3><div class=\"tw\"><table><tr><th></th><th>Simple</th><th>Continuous</th><th>Perfect</th><th>Perfect Continuous</th></tr><tr><td>Present</td><td>V1 (+s/es)</td><td>am/is/are + V-ing</td><td>have/has + V3</td><td>have/has been + V-ing</td></tr><tr><td>Past</td><td>V2</td><td>was/were + V-ing</td><td>had + V3</td><td>had been + V-ing</td></tr><tr><td>Future</td><td>will + V1</td><td>will be + V-ing</td><td>will have + V3</td><td>will have been + V-ing</td></tr></table></div><p>Key: V1 = base form (go), V2 = past simple (went), V3 = past participle (gone). Aspect tells you about the action: simple = a fact or complete action, continuous = in progress, perfect = completed before a point in time, perfect continuous = in progress over a period up to a point in time.</p><h3>2.2 Present tenses</h3><h4>1. Simple Present</h4><p>(+) S + V1 (add -s/-es for he/she/it)</p><p>(–) S + do/does + not + V1 (?) Do/Does + S + V1 ?</p><ul><li>Habits and routines.</li><li>General truths and facts.</li><li>Timetables and schedules.</li><li>States: know, like, want, belong.</li></ul><p>Signal words: always, usually, often, sometimes, never, every day, on Mondays</p><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>She walks to school every day.</p><p>Water boils at 100 °C.</p><p>The train leaves at 6 p.m. Does he speak French? No, he doesn’t.</p></div><h4>2. Present Continuous</h4><p>(+) S + am/is/are + V-ing (–) S + am/is/are + not + V-ing (?) Am/Is/Are + S + V-ing ?</p><ul><li>Action happening right now.</li><li>Temporary situations.</li><li>Planned future arrangements.</li><li>Changing trends; annoying habits with “always”.</li></ul><p>Signal words: now, at the moment, currently, today, this week, Look!, Listen!</p><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>I am studying at the moment.</p><p>They are staying in Kandy this week.</p><p>We are meeting the manager tomorrow at ten.</p></div><h4>3. Present Perfect</h4><p>(+) S + have/has + V3 (–) S + have/has + not + V3 (?) Have/Has + S + V3 ?</p><ul><li>Life experience (no specific time).</li><li>Action started in the past and continuing now.</li><li>Recent action with a present result.</li></ul><p>Signal words: ever, never, already, yet, just, recently, so far, since, for</p><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>I have visited Galle twice.</p><p>She has lived here since 2020.</p><p>He has just left, so you can’t speak to him.</p></div><h4>4. Present Perfect Continuous</h4><p>(+) S + have/has + been + V-ing (–) S + have/has + not + been + V-ing (?) Have/Has + S + been + V-ing ?</p><ul><li>Action that began in the past and is still continuing, stressing duration.</li><li>Recent activity with a visible result.</li></ul><p>Signal words: for, since, all day, lately, recently, how long</p><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>I have been waiting for an hour.</p><p>It has been raining all day.</p><p>Your hands are dirty. Have you been gardening?</p></div><div class=\"ex\"><p>Compare: Present perfect = result or experience (“I have read three books”). Present perfect continuous = activity and duration (“I have been reading for three hours”).</p></div><h3>2.3 Past tenses</h3><h4>5. Simple Past</h4><p>(+) S + V2 (–) S + did + not + V1 (?) Did + S + V1 ?</p><ul><li>Finished action at a definite time in the past.</li><li>A series of past actions (a story).</li><li>Past habits and states.</li></ul><p>Signal words: yesterday, last week, ago, in 2019, when I was a child</p><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>I visited my grandmother last Sunday.</p><p>She opened the door, looked outside and smiled.</p><p>Did you see the match? No, I didn’t.</p></div><h4>6. Past Continuous</h4><p>(+) S + was/were + V-ing (–) S + was/were + not + V-ing (?) Was/Were + S + V-ing ?</p><ul><li>Action in progress at a specific moment in the past.</li><li>A longer action interrupted by a shorter one (simple past).</li><li>Two actions happening at the same time.</li></ul><p>Signal words: while, when, as, at 8 p.m. last night</p><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>I was reading when the power went off.</p><p>At 8 p.m. yesterday, they were watching TV.</p><p>While she was cooking, he was cleaning.</p></div><h4>7. Past Perfect</h4><p>(+) S + had + V3 (–) S + had + not + V3 (?) Had + S + V3 ?</p><ul><li>The earlier of two past actions.</li><li>Reported speech and third conditional (see later).</li></ul><p>Signal words: before, after, by the time, already, just, never … before</p><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>When I arrived, the film had already started.</p><p>She had never seen snow before she moved to Canada.</p><p>After he had finished his homework, he went out.</p></div><h4>8. Past Perfect Continuous</h4><p>(+) S + had + been + V-ing (–) S + had + not + been + V-ing (?) Had + S + been + V-ing ?</p><ul><li>Duration of an action up to a moment in the past.</li><li>Explaining a past situation by its cause.</li></ul><p>Signal words: for, since, how long, by the time</p><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>He was tired because he had been running.</p><p>They had been waiting for two hours when the bus finally came.</p><p>I had been working there for five years before I resigned.</p></div><h3>2.4 Future tenses</h3><h4>9. Simple Future</h4><p>(+) S + will + V1 (–) S + will + not (won’t) + V1 (?) Will + S + V1 ?</p><ul><li>Decisions made at the moment of speaking.</li><li>Predictions, promises, offers.</li><li>Alternative: be going to + V1 for plans and evidence-based predictions.</li></ul><p>Signal words: tomorrow, next week, soon, probably, I think, in 2030</p><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>It’s cold. I will close the window.</p><p>I will call you tonight. (promise)</p><p>Look at those clouds. It is going to rain. (evidence)</p></div><h4>10. Future Continuous</h4><p>(+) S + will be + V-ing (–) S + will + not + be + V-ing (?) Will + S + be + V-ing ?</p><ul><li>Action in progress at a specific time in the future.</li><li>Polite questions about someone’s plans.</li></ul><p>Signal words: this time tomorrow, at 5 p.m. next Friday, soon</p><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>This time tomorrow, I will be flying to Dubai.</p><p>At 9 p.m. tonight, she will be sleeping.</p><p>Will you be using the car this evening?</p></div><h4>11. Future Perfect</h4><p>(+) S + will have + V3 (–) S + will + not + have + V3 (?) Will + S + have + V3 ?</p><ul><li>Action that will be completed before a point in the future.</li></ul><p>Signal words: by, by the time, by next year, before</p><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>By 2030, she will have graduated.</p><p>I will have finished the report by Friday.</p><p>By the time you arrive, we will have eaten.</p></div><h4>12. Future Perfect Continuous</h4><p>(+) S + will have been + V-ing (–) S + will + not + have been + V-ing (?) Will + S + have been + V-ing ?</p><ul><li>Duration of an action up to a point in the future.</li></ul><p>Signal words: by … for, by next month, by the end of the year</p><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>By June, I will have been working here for five years.</p><p>By the time he retires, he will have been teaching for forty years.</p><p>In March, they will have been living in Japan for a decade.</p></div><div class=\"ex\"><p>Important: In time clauses (when, after, before, as soon as, until), use a present tense, not will:</p><p>“I will call you when I arrive” (not “when I will arrive”).</p></div><h3>Quick Revision Sheet: The 12 Verb Tenses</h3><p>Everything from this topic in condensed tables. Use it for last-minute revision.</p><h4>Present</h4><div class=\"tw\"><table><tr><th>Tense</th><th>Formula</th><th>Use</th><th>Example</th></tr><tr><td>Simple Present</td><td>V1 (+s/es)</td><td>habits, facts, schedules</td><td>She walks to school daily.</td></tr><tr><td>Present Continuous</td><td>am/is/are + V-ing</td><td>now, temporary, planned future</td><td>I am studying now.</td></tr><tr><td>Present Perfect</td><td>have/has + V3</td><td>experience, recent result, unfinished (since/for)</td><td>I have visited Galle.</td></tr><tr><td>Present Perfect Continuous</td><td>have/has been + V-ing</td><td>duration up to now</td><td>I have been waiting for an hour.</td></tr></table></div><h4>Past</h4><div class=\"tw\"><table><tr><th>Tense</th><th>Formula</th><th>Use</th><th>Example</th></tr><tr><td>Simple Past</td><td>V2 (did + V1 in ? / –)</td><td>finished action, definite time</td><td>I visited her yesterday.</td></tr><tr><td>Past Continuous</td><td>was/were + V-ing</td><td>action in progress; interrupted action</td><td>I was reading when he called.</td></tr><tr><td>Past Perfect</td><td>had + V3</td><td>earlier of two past actions</td><td>The film had started when I arrived.</td></tr><tr><td>Past Perfect Continuous</td><td>had been + V-ing</td><td>duration before a past moment</td><td>He had been running, so he was tired.</td></tr></table></div><h4>Future</h4><div class=\"tw\"><table><tr><th>Tense</th><th>Formula</th><th>Use</th><th>Example</th></tr><tr><td>Simple Future</td><td>will + V1 (or be going to + V1)</td><td>decisions, promises, predictions</td><td>I will help you.</td></tr><tr><td>Future Continuous</td><td>will be + V-ing</td><td>in progress at a future time</td><td>This time tomorrow I will be flying.</td></tr><tr><td>Future Perfect</td><td>will have + V3</td><td>completed before a future time</td><td>I will have finished by 5.</td></tr><tr><td>Future Perfect Continuous</td><td>will have been + V-ing</td><td>duration up to a future time</td><td>By June I will have been working here for 5 years.</td></tr></table></div><h4>Signal words</h4><div class=\"tw\"><table><tr><th>Tense group</th><th>Signal words</th></tr><tr><td>Simple present</td><td>always, usually, often, never, every day</td></tr><tr><td>Present continuous</td><td>now, at the moment, currently, Look!</td></tr><tr><td>Present perfect</td><td>ever, never, already, yet, just, so far, since, for</td></tr><tr><td>Simple past</td><td>yesterday, last week, ago, in 2019</td></tr><tr><td>Past perfect</td><td>before, after, by the time, already</td></tr><tr><td>Future</td><td>tomorrow, next week, soon, by 2030, by the time</td></tr></table></div><div class=\"ex\"><p>Rule: In time clauses use present, not will: “I will call you when I arrive” (not “when I will arrive”).</p></div><p>Negatives: do/does/did + not + V1 | am/is/are/was/were + not | have/has/had + not + V3 | will + not Questions: move the first auxiliary before the subject: “Have you eaten?”</p><p>“Did she call?”</p>","3":"<h2>3. Sentence Structure</h2><p>A sentence is a group of words that expresses a complete thought. It must contain at least a subject and a verb (predicate) and make sense on its own.</p><h3>3.1 Subject and Predicate</h3><ul><li>Subject: who or what the sentence is about (the doer, or the thing being described).</li><li>Predicate: everything that tells us something about the subject. It always contains the verb.</li></ul><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>[The young girl] [sings beautifully]. Subject = The young girl; Predicate = sings beautifully.</p><p>[My brother and I] [are studying English]. (compound subject)</p><p>[Open the window]. (imperative: the subject “you” is understood)</p></div><h3>3.2 Objects</h3><div class=\"tw\"><table><tr><th>Part</th><th>Question to ask</th><th>Example</th></tr><tr><td>Direct object (DO)</td><td>Verb + what? / whom?</td><td>She bought a book. (bought what? a book)</td></tr><tr><td>Indirect object (IO)</td><td>To / for whom?</td><td>She gave him a book. (to whom? him)</td></tr><tr><td>Subject complement</td><td>After a linking verb; describes the subject</td><td>He is a teacher. The sky looks grey.</td></tr><tr><td>Object complement</td><td>Describes the object</td><td>They made her captain. It drives me crazy.</td></tr><tr><td>Adverbial</td><td>Where / when / how / why</td><td>We met at the station yesterday.</td></tr></table></div><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>Kamal sent his mother (IO) a gift (DO).</p><p>Kamal sent a gift (DO) to his mother (IO). (same meaning; IO moves after DO with to/for)</p><p>I made dinner (DO) for them (IO).</p></div><h3>3.3 Basic sentence patterns</h3><div class=\"tw\"><table><tr><th>Pattern</th><th>Meaning</th><th>Example</th></tr><tr><td>S + V</td><td>Subject + Verb</td><td>Birds fly.</td></tr><tr><td>S + V + O</td><td>Subject + Verb + Object</td><td>She reads novels.</td></tr><tr><td>S + V + C</td><td>Subject + Verb + Complement</td><td>He seems tired.</td></tr><tr><td>S + V + IO + DO</td><td>Two objects</td><td>He showed me the photo.</td></tr><tr><td>S + V + O + C</td><td>Object + Complement</td><td>We elected him president.</td></tr><tr><td>S + V + A</td><td>Verb + Adverbial</td><td>She lives in Matara.</td></tr></table></div><h3>3.4 Phrases and clauses</h3><ul><li>A phrase is a group of words with no subject-verb pair: “in the garden”, “running fast”.</li><li>A clause has a subject and a verb. An independent (main) clause can stand alone. A dependent (subordinate) clause cannot stand alone; it begins with a word like because, although, who, that, if, when.</li></ul><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>She smiled. (independent clause)</p><p>because she was happy (dependent clause: not a sentence by itself)</p></div><h3>3.5 Simple, Compound, Complex and Compound-complex sentences</h3><div class=\"tw\"><table><tr><th>Type</th><th>Structure</th><th>Example</th></tr><tr><td>Simple</td><td>One independent clause</td><td>The dog barked.</td></tr><tr><td>Compound</td><td>Two or more independent clauses joined by a coordinating conjunction (FANBOYS), or a semicolon</td><td>The dog barked, and the cat ran away.</td></tr><tr><td>Complex</td><td>One independent clause + one or more dependent clauses</td><td>The cat ran away because the dog barked.</td></tr><tr><td>Compound- complex</td><td>Two or more independent clauses + at least one dependent clause</td><td>The dog barked, and the cat ran away because it was scared.</td></tr></table></div><p>How to build each type</p><ul><li>Simple: Subject + Verb (+ object/adverbial). “Sunil plays cricket.” A simple sentence can still have a compound subject or verb: “Sunil and Ravi play and practise daily.”</li></ul><ul><li>Compound: Independent clause + , + FANBOYS + independent clause. “I wanted to go out, but it was raining.” With a semicolon: “It was raining; I stayed home.”</li></ul><ul><li>Complex: Dependent clause + comma + independent clause, OR independent clause + dependent clause (no comma). “Although it was raining, I went out.” / “I went out although it was raining.”</li></ul><ul><li>Compound-complex: Combine both methods. “When the bell rang, the students left, and the teacher locked the room.”</li></ul><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>Simple: Maya loves painting.</p><p>Compound: Maya loves painting, but her sister prefers music.</p><p>Complex: Maya paints whenever she feels stressed.</p></div><h4>Sentence types by purpose</h4><div class=\"tw\"><table><tr><th>Type</th><th>Purpose</th><th>Example</th></tr><tr><td>Declarative</td><td>States a fact or opinion</td><td>I like tea.</td></tr><tr><td>Interrogative</td><td>Asks a question</td><td>Do you like tea?</td></tr><tr><td>Imperative</td><td>Gives a command or request</td><td>Please sit down.</td></tr><tr><td>Exclamatory</td><td>Expresses strong feeling</td><td>What a lovely day!</td></tr></table></div><h4>Common sentence errors</h4><div class=\"tw\"><table><tr><th>Error</th><th>Wrong</th><th>Correct</th></tr><tr><td>Fragment (incomplete)</td><td>Because I was late.</td><td>I missed the bus because I was late.</td></tr><tr><td>Run-on (no punctuation)</td><td>I was tired I went to bed.</td><td>I was tired, so I went to bed.</td></tr><tr><td>Comma splice</td><td>It was late, we left.</td><td>It was late, so we left. / It was late; we left.</td></tr></table></div><h3>Quick Revision Sheet: Sentence Structure</h3><p>Everything from this topic in condensed tables. Use it for last-minute revision.</p><div class=\"tw\"><table><tr><th>Element</th><th>Meaning</th><th>Example</th></tr><tr><td>Subject</td><td>who/what the sentence is about</td><td>The girl sings.</td></tr><tr><td>Predicate</td><td>the verb part (says something about the subject)</td><td>The girl sings beautifully.</td></tr><tr><td>Direct object</td><td>receives the action (verb + what/whom?)</td><td>She bought a book.</td></tr><tr><td>Indirect object</td><td>to/for whom</td><td>She gave him a book. = She gave a book to him.</td></tr><tr><td>Complement</td><td>completes a linking verb</td><td>He is a doctor. She seems happy.</td></tr><tr><td>Adverbial</td><td>where / when / how / why</td><td>We met at the station.</td></tr></table></div><div class=\"tw\"><table><tr><th>Pattern</th><th>Example</th></tr><tr><td>S + V</td><td>Birds fly.</td></tr><tr><td>S + V + O</td><td>She reads novels.</td></tr><tr><td>S + V + C</td><td>He seems tired.</td></tr><tr><td>S + V + IO + DO</td><td>He showed me the photo.</td></tr><tr><td>S + V + O + C</td><td>They made her captain.</td></tr></table></div><h4>Clause and sentence types</h4><div class=\"tw\"><table><tr><th>Type</th><th>Structure</th><th>Example</th></tr><tr><td>Simple</td><td>1 independent clause</td><td>The dog barked.</td></tr><tr><td>Compound</td><td>2 independent clauses + FANBOYS / semicolon</td><td>The dog barked, and the cat ran.</td></tr><tr><td>Complex</td><td>independent + dependent clause</td><td>The cat ran because the dog barked.</td></tr><tr><td>Compound- complex</td><td>2+ independent + 1+ dependent</td><td>The dog barked, and the cat ran because it was scared.</td></tr></table></div><ul><li>Declarative (statement), interrogative (question), imperative (command), exclamatory (strong feeling).</li></ul><ul><li>Fragment: “Because I was late.” → “I missed the bus because I was late.”</li><li>Run-on / comma splice: “It was late, we left.” → “It was late, so we left.”</li></ul>","4":"<h2>4. Voice: Active and Passive</h2><p>Voice shows whether the subject performs the action (active) or receives it (passive).</p><div class=\"tw\"><table><tr><th>Voice</th><th>Focus</th><th>Example</th></tr><tr><td>Active</td><td>The doer (agent) is the subject</td><td>The chef cooked the meal.</td></tr><tr><td>Passive</td><td>The receiver of the action is the subject</td><td>The meal was cooked by the chef.</td></tr></table></div><div class=\"tip\"><b>Passive formula:</b> Object of active → Subject + be (in the same tense) + V3 (+ by + agent)</div><h3>4.1 How to change active into passive (3 steps)</h3><ul><li>Step 1: Move the object of the active sentence to the front: it becomes the new subject.</li><li>Step 2: Use the correct form of be in the same tense as the active verb, followed by the past participle (V3).</li></ul><ul><li>Step 3: Put the old subject after by (optional; omit it if it is unknown, obvious or unimportant).</li></ul><p>Change pronouns: I → me, he → him, she → her, we → us, they → them.</p><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>Active: Rita wrote the letter. → Passive: The letter was written by Rita.</p><p>Active: They are building a new bridge. → Passive: A new bridge is being built.</p><p>Active: Someone has stolen my bike. → Passive: My bike has been stolen. (agent unknown, so omitted)</p></div><h3>4.2 Passive forms in every tense</h3><div class=\"tw\"><table><tr><th>Tense</th><th>Passive formula</th><th>Example</th></tr><tr><td>Simple present</td><td>am/is/are + V3</td><td>English is spoken here.</td></tr><tr><td>Present continuous</td><td>am/is/are being + V3</td><td>The road is being repaired.</td></tr><tr><td>Present perfect</td><td>have/has been + V3</td><td>The work has been finished.</td></tr><tr><td>Simple past</td><td>was/were + V3</td><td>The window was broken.</td></tr><tr><td>Past continuous</td><td>was/were being + V3</td><td>The car was being washed.</td></tr><tr><td>Past perfect</td><td>had been + V3</td><td>The tickets had been sold.</td></tr><tr><td>Simple future</td><td>will be + V3</td><td>The results will be announced soon.</td></tr><tr><td>Future perfect</td><td>will have been + V3</td><td>The task will have been completed by noon.</td></tr><tr><td>Modals</td><td>modal + be + V3</td><td>This rule must be followed.</td></tr><tr><td>Infinitive</td><td>to be + V3</td><td>I want to be told the truth.</td></tr></table></div><div class=\"ex\"><p>Note: The perfect continuous tenses and future continuous are rarely used in the passive. Only transitive verbs (verbs that take an object) can be made passive. Intransitive verbs such as arrive, sleep and happen cannot be passive.</p></div><h3>4.3 Special cases</h3><ul><li>Two objects: Both can become the subject. “She gave him a gift.” → “He was given a gift.” or “A gift was given to him.”</li></ul><ul><li>Questions: “Who wrote this poem?” → “By whom was this poem written?” / “Did they finish the work?” → “Was the work finished?”</li></ul><ul><li>Commands: “Close the door.” → “Let the door be closed.” / “You are requested to close the door.”</li></ul><ul><li>Verbs of opinion and reporting: “People say he is rich.” → “He is said to be rich.” / “It is said that he is rich.”</li></ul><h3>4.4 When to use the passive</h3><ul><li>The doer is unknown or unimportant: “My wallet was stolen.”</li><li>The action or result matters more than the doer: “The bridge was completed in 2020.”</li><li>Formal, scientific or news writing: “The samples were heated to 90 °C.”</li><li>To avoid blaming someone: “A mistake was made.”</li></ul><div class=\"ex\"><p>Style tip: Use the active voice for most everyday writing: it is clearer and shorter. Use the passive only when you have a good reason.</p></div><h3>Quick Revision Sheet: Voice: Active and Passive</h3><p>Everything from this topic in condensed tables. Use it for last-minute revision.</p><div class=\"tip\"><b>Rule:</b> Object becomes subject + be (same tense) + V3 (+ by + doer)</div><div class=\"tw\"><table><tr><th>Tense</th><th>Active</th><th>Passive</th></tr><tr><td>Simple present</td><td>She writes letters.</td><td>Letters are written by her.</td></tr><tr><td>Present continuous</td><td>They are building a bridge.</td><td>A bridge is being built.</td></tr><tr><td>Present perfect</td><td>He has finished the work.</td><td>The work has been finished.</td></tr><tr><td>Simple past</td><td>Rita wrote the letter.</td><td>The letter was written by Rita.</td></tr><tr><td>Past continuous</td><td>They were repairing the road.</td><td>The road was being repaired.</td></tr><tr><td>Past perfect</td><td>She had sold the car.</td><td>The car had been sold.</td></tr><tr><td>Simple future</td><td>They will announce the result.</td><td>The result will be announced.</td></tr><tr><td>Modal</td><td>You must follow the rules.</td><td>The rules must be followed.</td></tr></table></div><ul><li>Steps: 1) move the object to the front; 2) use correct form of be + V3; 3) add by + doer only if needed.</li></ul><ul><li>Use the passive when the doer is unknown or unimportant: “My bike was stolen.”</li><li>Only transitive verbs can become passive (not arrive, sleep, happen).</li></ul>","5":"<h2>5. Modal Verbs</h2><p>Modal verbs are helping verbs that show ability, permission, possibility, advice, obligation and more. Modals have three special rules:</p><ul><li>They are followed by the base verb (no “to”, no -s, no -ing): “She can swim” (not “She can swims”).</li></ul><ul><li>They have no -s in the third person: “He must go”.</li><li>Questions and negatives are made without do/does: “Can you help?” “I cannot (can’t) go.”</li></ul><h3>5.1 Modal verbs and their uses</h3><div class=\"tw\"><table><tr><th>Modal</th><th>Main uses</th><th>Examples</th></tr><tr><td>can</td><td>Ability (present); permission (informal); possibility; requests</td><td>I can swim. Can I use your phone?</td></tr><tr><td>could</td><td>Past ability; polite requests; weaker possibility; suggestions</td><td>She could read at four. Could you help me, please?</td></tr><tr><td>may</td><td>Formal permission; possibility (about 50%)</td><td>May I come in? It may rain later.</td></tr><tr><td>might</td><td>Weaker possibility (about 30%)</td><td>He might be late; the roads are busy.</td></tr><tr><td>will</td><td>Predictions, promises, instant decisions</td><td>I will help you.</td></tr><tr><td>would</td><td>Polite requests/offers; past habits; hypothetical results</td><td>Would you like some tea? When I was young, I would play outside all day.</td></tr><tr><td>shall</td><td>Offers and suggestions with I / we (mainly British)</td><td>Shall I open the window?</td></tr><tr><td>should</td><td>Advice, recommendations, expectation</td><td>You should see a doctor.</td></tr><tr><td>ought to</td><td>Advice (similar to should; slightly stronger moral sense)</td><td>We ought to respect our elders.</td></tr><tr><td>must</td><td>Strong obligation; strong logical deduction; prohibition (mustn’t)</td><td>You must wear a seatbelt. He must be tired; he has worked all night.</td></tr><tr><td>have to</td><td>External obligation (rules, laws). Not must in past, negative or future</td><td>I have to wear a uniform at school.</td></tr></table></div><h3>5.2 Key contrasts</h3><p>Must vs. have to vs. mustn’t vs. don’t have to</p><div class=\"tw\"><table><tr><th>Form</th><th>Meaning</th><th>Example</th></tr><tr><td>must</td><td>Obligation from the speaker’s own feeling</td><td>I must call my mother tonight.</td></tr><tr><td>have to</td><td>Obligation from rules or circumstances</td><td>Drivers have to carry a licence.</td></tr><tr><td>mustn’t</td><td>It is forbidden / prohibited</td><td>You mustn’t smoke here.</td></tr><tr><td>don’t have to</td><td>It is not necessary (but allowed)</td><td>You don’t have to come if you’re busy.</td></tr></table></div><p>Degrees of certainty (deduction)</p><div class=\"tw\"><table><tr><th>Modal</th><th>Certainty</th><th>Example</th></tr><tr><td>must</td><td>About 90–95% sure (positive)</td><td>She must be at home; her lights are on.</td></tr><tr><td>will / should</td><td>Expected</td><td>The package should arrive tomorrow.</td></tr><tr><td>may / might / could</td><td>50% to 30% sure</td><td>He may be sleeping. / It could be true.</td></tr><tr><td>can’t / couldn’t</td><td>About 95% sure it is impossible</td><td>That can’t be right; it’s too cheap.</td></tr></table></div><h3>5.3 Past modals (modal + have + V3)</h3><div class=\"tw\"><table><tr><th>Form</th><th>Meaning</th><th>Example</th></tr><tr><td>should have + V3</td><td>A past mistake; advice that was not followed</td><td>You should have studied harder.</td></tr><tr><td>shouldn’t have + V3</td><td>Regret about something done</td><td>I shouldn’t have said that.</td></tr><tr><td>could have + V3</td><td>Past possibility that did not happen</td><td>She could have won the race.</td></tr><tr><td>must have + V3</td><td>Strong guess about the past</td><td>He must have forgotten the meeting.</td></tr><tr><td>might / may have + V3</td><td>Possible past event</td><td>They might have missed the train.</td></tr><tr><td>can’t have + V3</td><td>Impossible in the past (strong deduction)</td><td>She can’t have left yet; her coat is here.</td></tr></table></div><h3>5.4 Polite requests, offers and permission</h3><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>Could you pass the salt, please? (polite request)</p><p>Shall I carry your bag? (offer)</p><p>May I leave early today? (formal permission)</p></div><h3>Quick Revision Sheet: Modal Verbs</h3><p>Everything from this topic in condensed tables. Use it for last-minute revision.</p><p>Modals take the base verb (no -s, no “to”, no -ing). Questions and negatives need no do/does.</p><div class=\"tw\"><table><tr><th>Modal</th><th>Use</th><th>Example</th></tr><tr><td>can</td><td>ability, informal permission, request</td><td>I can swim. Can I sit here?</td></tr><tr><td>could</td><td>past ability, polite request, suggestion</td><td>She could read at four. Could you help?</td></tr><tr><td>may</td><td>formal permission, possibility (50%)</td><td>May I come in? It may rain.</td></tr><tr><td>might</td><td>weaker possibility (30%)</td><td>He might be late.</td></tr><tr><td>will / would</td><td>prediction, promise / polite request, hypothesis</td><td>I will call. Would you like tea?</td></tr><tr><td>shall</td><td>offer or suggestion with I / we</td><td>Shall I open the window?</td></tr><tr><td>should / ought to</td><td>advice, expectation</td><td>You should see a doctor.</td></tr><tr><td>must</td><td>strong obligation / strong deduction</td><td>You must stop. He must be tired.</td></tr><tr><td>have to</td><td>external rule or necessity</td><td>I have to wear a uniform.</td></tr><tr><td>mustn’t</td><td>prohibition</td><td>You mustn’t smoke here.</td></tr><tr><td>don’t have to</td><td>not necessary</td><td>You don’t have to come.</td></tr></table></div><div class=\"tw\"><table><tr><th>Past modal</th><th>Meaning</th><th>Example</th></tr><tr><td>should have + V3</td><td>mistake / unfollowed advice</td><td>You should have studied.</td></tr><tr><td>could have + V3</td><td>past possibility that did not happen</td><td>She could have won.</td></tr><tr><td>must have + V3</td><td>strong guess about the past</td><td>He must have forgotten.</td></tr><tr><td>might have + V3</td><td>possible past event</td><td>They might have left.</td></tr><tr><td>can’t have + V3</td><td>impossible in the past</td><td>She can’t have left yet.</td></tr></table></div>","6":"<h2>6. Conditionals (“If…” Sentences)</h2><p>A conditional sentence has two parts: the if-clause (the condition) and the main clause (the result). The if-clause can come first (use a comma) or second (no comma).</p><div class=\"tw\"><table><tr><th>Type</th><th>If-clause</th><th>Main clause</th><th>Use</th></tr><tr><td>Zero</td><td>If + present simple</td><td>present simple</td><td>General truths, scientific facts</td></tr><tr><td>First</td><td>If + present simple</td><td>will + V1</td><td>Real or likely future situation</td></tr><tr><td>Second</td><td>If + past simple</td><td>would + V1</td><td>Unreal or unlikely present/future</td></tr><tr><td>Third</td><td>If + past perfect</td><td>would have + V3</td><td>Unreal past; regret</td></tr></table></div><h3>6.1 Zero Conditional</h3><div class=\"tip\"><b>Formula:</b> If + present simple, present simple</div><p>Used for facts that are always true. “If” can be replaced by “when”.</p><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>If you heat ice, it melts.</p><p>If I drink coffee at night, I can’t sleep.</p><p>Plants die if they don’t get water.</p></div><h3>6.2 First Conditional</h3><div class=\"tip\"><b>Formula:</b> If + present simple, will + base verb</div><p>Used for real possibilities in the future. You can also use modals (can, may, might, should) or an imperative in the main clause.</p><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>If it rains tomorrow, we will stay at home.</p><p>If you study hard, you will pass the exam.</p><p>If you see Nimal, tell him to call me. (imperative)</p></div><div class=\"tip warn\"><b>Common mistake:</b> Never use will in the if-clause: “If it rains” (not “If it will rain”).</div><h3>6.3 Second Conditional</h3><div class=\"tip\"><b>Formula:</b> If + past simple, would + base verb</div><p>Used for imaginary or unlikely situations in the present or future, and for polite advice. With be, use were for all subjects in formal English.</p><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>If I had a million dollars, I would travel the world.</p><p>If I were you, I would apologise. (advice)</p><p>She would help you if she knew the answer.</p></div><h3>6.4 Third Conditional</h3><div class=\"tip\"><b>Formula:</b> If + past perfect (had + V3), would have + V3</div><p>Used for imaginary situations in the past, which cannot be changed now. It often expresses regret or criticism.</p><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>If I had studied harder, I would have passed. (but I didn’t study)</p><p>If they had left earlier, they wouldn’t have missed the flight.</p><p>She could have won if she had trained more.</p></div><h3>6.5 Mixed Conditional and useful extras</h3><ul><li>Mixed (past → present): If + past perfect, would + base. “If I had taken that job, I would be rich now.”</li></ul><ul><li>Unless = if … not. “Unless you hurry, you’ll be late.” (= If you don’t hurry…)</li><li>As long as / provided that / on condition that = only if. “You can go as long as you’re back by ten.”</li></ul><ul><li>Wish / If only: wish + past simple (present regret): “I wish I had more time.” wish + past perfect (past regret): “I wish I had called her.”</li></ul><div class=\"tw\"><table><tr><th>Type</th><th>Real or unreal?</th><th>Time</th></tr><tr><td>Zero</td><td>Real (always true)</td><td>Any time</td></tr><tr><td>First</td><td>Real / possible</td><td>Future</td></tr><tr><td>Second</td><td>Unreal / unlikely</td><td>Present or future</td></tr><tr><td>Third</td><td>Unreal (impossible)</td><td>Past</td></tr></table></div><h3>Quick Revision Sheet: Conditionals (“If…” Sentences)</h3><p>Everything from this topic in condensed tables. Use it for last-minute revision.</p><div class=\"tw\"><table><tr><th>Type</th><th>Formula</th><th>Use</th><th>Example</th></tr><tr><td>Zero</td><td>If + present, present</td><td>facts, always true</td><td>If you heat ice, it melts.</td></tr><tr><td>First</td><td>If + present, will + V1</td><td>real future possibility</td><td>If it rains, we will stay home.</td></tr><tr><td>Second</td><td>If + past, would + V1</td><td>unreal present / future; advice</td><td>If I had money, I would buy a car.</td></tr><tr><td>Third</td><td>If + had + V3, would have + V3</td><td>unreal past; regret</td><td>If I had studied, I would have passed.</td></tr><tr><td>Mixed</td><td>If + had + V3, would + V1</td><td>past cause → present result</td><td>If I had taken the job, I would be rich now.</td></tr></table></div><ul><li>Unless = if … not: “Unless you hurry, you’ll be late.”</li><li>Were for all subjects in formal second conditional: “If I were you, I would apologise.”</li><li>Wish + past simple (present regret): “I wish I had more time.” Wish + past perfect (past regret): “I wish I had called.”</li></ul><ul><li>Never put will in the if-clause: “If it rains” (not “will rain”).</li></ul>","7":"<h2>7. Reported (Indirect) Speech</h2><p>Direct speech gives the exact words with quotation marks. Reported speech tells what someone said without quoting exactly.</p><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>Direct: She said, “I am tired.”</p><p>Reported: She said (that) she was tired.</p></div><h3>7.1 The main changes</h3><h4>A. Backshift of tenses</h4><p>When the reporting verb is in the past (said, told), the tense usually moves one step back:</p><div class=\"tw\"><table><tr><th>Direct speech</th><th>Reported speech</th></tr><tr><td>Simple present: “I work here.”</td><td>Simple past: He said he worked there.</td></tr><tr><td>Present continuous: “I am working.”</td><td>Past continuous: He said he was working.</td></tr><tr><td>Present perfect: “I have finished.”</td><td>Past perfect: He said he had finished.</td></tr><tr><td>Simple past: “I bought it.”</td><td>Past perfect: He said he had bought it.</td></tr><tr><td>Past continuous: “I was sleeping.”</td><td>Past perfect continuous: He said he had been sleeping.</td></tr><tr><td>will: “I will help.”</td><td>would: He said he would help.</td></tr><tr><td>can: “I can swim.”</td><td>could: He said he could swim.</td></tr><tr><td>may: “I may go.”</td><td>might: He said he might go.</td></tr><tr><td>must: “I must leave.”</td><td>had to: He said he had to leave.</td></tr></table></div><div class=\"ex\"><p>No change: Past perfect, could, would, should, might and ought to do not change. “I should go” → He said he should go.</p></div><p>B. Pronouns and time/place words</p><div class=\"tw\"><table><tr><th>Direct</th><th>Reported</th></tr><tr><td>I / we</td><td>he, she / they (depending on who spoke)</td></tr><tr><td>my / our</td><td>his, her / their</td></tr><tr><td>now</td><td>then / at that time</td></tr><tr><td>today</td><td>that day</td></tr><tr><td>tomorrow</td><td>the next day / the following day</td></tr><tr><td>yesterday</td><td>the day before / the previous day</td></tr><tr><td>last night / week</td><td>the night / week before</td></tr><tr><td>ago</td><td>before</td></tr><tr><td>here</td><td>there</td></tr><tr><td>this / these</td><td>that / those</td></tr></table></div><h3>7.2 Reporting different sentence types</h3><h4>Statements</h4><div class=\"tip\"><b>Formula:</b> S + said (that) + S + backshifted verb</div><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>“I am going to Kandy,” she said. → She said that she was going to Kandy.</p><p>“We have bought a house,” they told me. → They told me that they had bought a house.</p></div><div class=\"ex\"><p>Remember: say is used without a person (“He said that…”); tell needs a person (“He told me that…”).</p></div><h4>Yes/No questions</h4><div class=\"tip\"><b>Formula:</b> asked + if / whether + S + V (statement word order, no question mark)</div><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>“Do you like tea?” he asked. → He asked if I liked tea.</p><p>“Have you finished?” she asked. → She asked whether I had finished.</p></div><h4>Wh-questions</h4><div class=\"tip\"><b>Formula:</b> asked + wh-word + S + V (statement word order)</div><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>“Where do you live?” he asked. → He asked where I lived.</p><p>“What are you doing?” she asked. → She asked what I was doing.</p></div><h4>Commands, requests and advice</h4><div class=\"tip\"><b>Formula:</b> told / asked / ordered + person + (not) to + V1</div><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>“Sit down,” the teacher said. → The teacher told us to sit down.</p><p>“Please don’t be late,” she said. → She asked me not to be late.</p><p>“You should rest,” he said. → He advised me to rest.</p></div><h3>7.3 Other points</h3><ul><li>No backshift needed if the statement is still true or is a general fact: “The earth goes round the sun,” he said. → He said the earth goes round the sun.</li></ul><ul><li>No backshift if the reporting verb is in the present (says, has said): “I am tired,” she says. →</li></ul><p>She says she is tired.</p><ul><li>Useful reporting verbs: suggest, promise, warn, admit, deny, explain, advise, offer, refuse, remind, invite. “He promised to call me.” / “She denied taking the money.”</li></ul><ul><li>Suggest + -ing / that: “Let’s go home.” → He suggested going home. / He suggested that we go home.</li></ul><h3>Quick Revision Sheet: Reported (Indirect) Speech</h3><p>Everything from this topic in condensed tables. Use it for last-minute revision.</p><div class=\"tw\"><table><tr><th>Direct</th><th>Reported</th></tr><tr><td>Simple present: “I work.”</td><td>He said he worked.</td></tr><tr><td>Present continuous: “I am working.”</td><td>He said he was working.</td></tr><tr><td>Present perfect: “I have finished.”</td><td>He said he had finished.</td></tr><tr><td>Simple past: “I bought it.”</td><td>He said he had bought it.</td></tr><tr><td>will / can / may / must</td><td>would / could / might / had to</td></tr></table></div><div class=\"tw\"><table><tr><th>Direct</th><th>Reported</th><th>Direct</th><th>Reported</th></tr><tr><td>now</td><td>then</td><td>here</td><td>there</td></tr><tr><td>today</td><td>that day</td><td>this</td><td>that</td></tr><tr><td>tomorrow</td><td>the next day</td><td>yesterday</td><td>the day before</td></tr><tr><td>last week</td><td>the week before</td><td>ago</td><td>before</td></tr></table></div><div class=\"tw\"><table><tr><th>Sentence type</th><th>Formula</th><th>Example</th></tr><tr><td>Statement</td><td>said (that) + backshifted clause</td><td>“I am tired.” → She said she was tired.</td></tr><tr><td>Yes/No question</td><td>asked + if/whether + statement order</td><td>“Do you like tea?” → He asked if I liked tea.</td></tr><tr><td>Wh- question</td><td>asked + wh-word + statement order</td><td>“Where do you live?” → He asked where I lived.</td></tr><tr><td>Command / request</td><td>told / asked + person + (not) to + V1</td><td>“Sit down.” → She told me to sit down.</td></tr></table></div><div class=\"ex\"><p>Exceptions: No backshift when the statement is still true or the reporting verb is present: “The earth goes round the sun,” he said → He said the earth goes round the sun. say has no person after it; tell needs one: “He told me”.</p></div>","8":"<h2>8. Gerunds and Infinitives</h2><p>Many verbs are followed by another verb. That second verb is either a gerund (verb + -ing) or an infinitive (to + verb). The first verb decides which form to use.</p><h3>8.1 Gerunds (verb + -ing used as a noun)</h3><h4>Uses of the gerund</h4><ul><li>As the subject: Swimming is good exercise.</li><li>As the object of a verb: I enjoy reading.</li><li>After a preposition: She is good at drawing. Thanks for coming.</li><li>After certain expressions: It’s no use crying. I can’t help laughing. It’s worth trying.</li></ul><p>Verbs followed by a gerund</p><div class=\"tw\"><table><tr><th>Group</th><th>Verbs</th></tr><tr><td>Liking / disliking</td><td>enjoy, like (also to), love, hate, dislike, mind, can’t stand</td></tr><tr><td>Starting / stopping</td><td>finish, quit, give up, stop, avoid, delay, postpone</td></tr><tr><td>Thinking / saying</td><td>consider, imagine, suggest, deny, admit, recommend, risk</td></tr><tr><td>Others</td><td>keep, practise, miss, involve, fancy, appreciate</td></tr></table></div><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>I enjoy cooking for my family.</p><p>She avoided answering the question.</p><p>They suggested going to the cinema.</p></div><h3>8.2 Infinitives (to + base verb)</h3><h4>Uses of the infinitive</h4><ul><li>To show purpose: I went to the shop to buy milk.</li><li>After certain verbs: I want to learn French.</li><li>After adjectives: It is easy to use. I am happy to help.</li><li>With too / enough: It’s too hot to play. She is old enough to drive.</li><li>After question words: I don’t know what to say. Show me how to do it.</li></ul><p>Verbs followed by an infinitive</p><div class=\"tw\"><table><tr><th>Group</th><th>Verbs</th></tr><tr><td>Wanting / hoping</td><td>want, need, hope, wish, expect, plan, intend, would like</td></tr><tr><td>Deciding</td><td>decide, choose, agree, refuse, promise, offer, learn, manage</td></tr><tr><td>Verb + object + to</td><td>tell, ask, advise, allow, invite, want, remind, persuade, force</td></tr></table></div><h4 class=\"exl\">Examples</h4><div class=\"ex\"><p>He de
